function Sparkline({data,color=C.accent,h=40,w=100}){
  if(!data||data.length<2) return null;
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/range)*(h-6)-3}`).join(" ");
  const [lx,ly]=pts.split(" ").pop().split(",");
  return React.createElement("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`,style:{flexShrink:0}},
    React.createElement("polyline",{fill:"none",stroke:color,strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round",points:pts}),
    React.createElement("circle",{cx:lx,cy:ly,r:"3",fill:color})
  );
}

function MiniBar({series,labels,colors,h=100}){

  return React.createElement("div",{style:{display:"flex",alignItems:"flex-end",gap:4,height:h}},
    series[0].map((_,i)=>
      React.createElement("div",{key:i,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}},
        React.createElement("div",{style:{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:h-18}},
          series.map((s,si)=>
            React.createElement("div",{key:si,style:{flex:1,background:colors[si],borderRadius:"3px 3px 0 0",height:`${(s[i]/max)*100}%`,minHeight:2,transition:"height .4s"}})
          )
        ),
        React.createElement("span",{style:{fontSize:9,color:C.muted}},labels[i])
      )
    )
  );
}

function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t);},[]);
  return React.createElement("div",{style:{position:"fixed",bottom:24,right:16,background:C.card,border:`1px solid ${type==="error"?C.rose:C.green}`,borderRadius:10,padding:"12px 18px",zIndex:999,color:C.text,fontSize:13,fontWeight:500,boxShadow:"0 8px 32px rgba(0,0,0,.4)",display:"flex",gap:10,alignItems:"center"}},
    React.createElement("span",{style:{color:type==="error"?C.rose:C.green}},type==="error"?"✕":"✓"),
    msg
  );
}

function useToast(){
  const [toasts,setToasts]=useState([]);
  const show=(msg,type="success")=>setToasts(t=>[...t,{id:Date.now(),msg,type}]);
  const remove=id=>setToasts(t=>t.filter(x=>x.id!==id));
  return {toasts,show,remove};
}

function Dashboard({sales,expenses,clients,products}){
  const todaySales=sales.filter(s=>s.date===today()).reduce((a,s)=>a+s.price*s.qty,0);
  const monthSales=sales.reduce((a,s)=>a+s.price*s.qty,0);
  const monthCosts=sales.reduce((a,s)=>a+s.cost*s.qty,0);
  const monthExp=expenses.reduce((a,e)=>a+e.amount,0);
  const netProfit=monthSales-monthCosts-monthExp;
  const receivable=sales.filter(s=>s.status!=="paid").reduce((a,s)=>a+(s.price*s.qty-(s.paid||0)),0);
  const lowStock=products.filter(p=>p.stock<=p.min_stock);
  const topProds=Object.values(sales.reduce((acc,s)=>{
    if(!acc[s.product])acc[s.product]={name:s.product,qty:0};
    acc[s.product].qty+=s.qty; return acc;
  },{})).sort((a,b)=>b.qty-a.qty).slice(0,5);

      React.createElement(StatCard,{label:"Ganancia Neta",value:fmtK(netProfit),trend:15,spark:MS.map((v,i)=>v-ME[i]),sparkColor:C.green,accent:C.green}),
      React.createElement(StatCard,{label:"Por Cobrar",value:fmtK(receivable),sub:"cartera activa",accent:C.amber}),
      React.createElement(StatCard,{label:"Clientes",value:clients.length,sub:"+2 este mes"})
    ),

    // Charts row

  const totalSales=pending.reduce((a,s)=>a+s.price*s.qty,0);
  const recovered=totalSales-totalPending;

  const doPayment=async(sale,amount,method)=>{
    try{
      const {paid,status}=await api.addPayment(sale.id,+amount,method,sale.paid||0,sale.price*sale.qty);
      setSales(p=>p.map(s=>s.id!==sale.id?s:{...s,paid,status}));

function ProfitModule({sales,expenses}){
  const tS=sales.reduce((a,s)=>a+s.price*s.qty,0);
  const tC=sales.reduce((a,s)=>a+s.cost*s.qty,0);
  const tE=expenses.reduce((a,e)=>a+e.amount,0);
  const gB=tS-tC,nP=gB-tE,mg=tS>0?Math.round((nP/tS)*100):0;

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:16}},
    React.createElement(SectionHeader,{title:"Ganancias y Reportes"}),
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}},
      React.createElement(StatCard,{label:"Ingresos",value:fmtK(tS),accent:C.accent,spark:MS,sparkColor:C.accent}),
      React.createElement(StatCard,{label:"Costo Ventas",value:fmtK(tC),accent:C.rose}),
      React.createElement(StatCard,{label:"Ganancia Bruta",value:fmtK(gB),accent:C.amber}),
      React.createElement(StatCard,{label:"Gastos Oper.",value:fmtK(tE),accent:C.rose}),
      React.createElement(StatCard,{label:"Ganancia Neta",value:fmtK(nP),accent:C.green,spark:MS.map((v,i)=>v-ME[i]),sparkColor:C.green}),
      React.createElement(StatCard,{label:"Margen Neto",value:`${mg}%`,accent:mg>20?C.green:mg>10?C.amber:C.rose})
    ),
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}},
      [{label:"Hoy",f:.03},{label:"Semana",f:.22},{label:"Mes",f:1},{label:"Año",f:12}].map(p=>{
        const profit=(tS-tE)*p.f;
        return React.createElement("div",{key:p.label,style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,textAlign:"center"}},
          React.createElement("div",{style:{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:.6}},p.label),
          React.createElement("div",{style:{fontSize:20,fontWeight:700,color:profit>=0?C.green:C.rose,marginTop:6,fontFamily:"monospace"}},fmtK(profit))
        );
      })
    ),
    React.createElement("div",{style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:22}},
      React.createElement("h4",{style:{margin:"0 0 16px",color:C.text,fontSize:16,fontWeight:700}},"Estado de Resultados"),
      [
        {l:"(+) Ventas totales",v:tS,c:C.text},
        {l:"(−) Costo de ventas",v:tC,c:C.rose},
        {l:"= Ganancia bruta",v:gB,c:C.amber,b:true},
        {l:"(−) Gastos operativos",v:tE,c:C.rose},
        {l:"= Ganancia neta",v:nP,c:C.green,b:true,big:true},
      ].map((r,i,arr)=>React.createElement("div",{key:r.l,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none"}},
        React.createElement("span",{style:{fontSize:r.big?15:13,color:C.text,fontWeight:r.b?700:400}},r.l),
        React.createElement("span",{style:{fontSize:r.big?20:14,fontWeight:r.b?700:500,color:r.c,fontFamily:"monospace"}},fmt(r.v))
      ))
    ),
    React.createElement("div",{style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}},

    )
  );

// MÓDULO CRYPTO — API layer (extiende api existente, no reemplaza nada)
// Reutiliza: suppliers→proveedores, clients→clientes, cash_flow→flujo de caja
// Tablas nuevas: crypto_purchases, crypto_sales, crypto_inventory, crypto_kardex
// ═══════════════════════════════════════════════════════════════════════════

const COINS = ["USDT","USDC","BTC","ETH","BNB","TRX","SOL","DAI"];
const COIN_COLORS = {
  USDT:"#26A17B", USDC:"#2775CA", BTC:"#F7931A",
  ETH:"#627EEA", BNB:"#F3BA2F", TRX:"#FF0013",
  SOL:"#9945FF", DAI:"#F5AC37"
};
const fmtCrypto = (n,sym) => {
  const d = sym==="BTC"?8:sym==="ETH"||sym==="SOL"?4:2;
  return parseFloat((n||0).toFixed(d)).toString();
};

const cryptoApi = {
  // ── Inventario ──────────────────────────────────────────
  async getInventory(){
    const {data,error}=await sb.from("crypto_inventory_view").select("*");
    if(error) throw error;
    return data||[];
  },

  // ── Compras crypto ──────────────────────────────────────
  async getCryptoPurchases(){
    const {data,error}=await sb.from("crypto_purchases").select("*").order("date",{ascending:false});
    if(error) throw error;
    return data||[];
  },
  async addCryptoPurchase(p){
    // 1. Insertar compra
    const {data,error}=await sb.from("crypto_purchases").insert({
      date:p.date, symbol:p.symbol, quantity:+p.quantity,
      unit_cost:+p.unit_cost, total:+p.quantity*+p.unit_cost,
      currency:p.currency||"COP", supplier:p.supplier,
      pay_method:p.pay_method, notes:p.notes
    }).select().single();
    if(error) throw error;

    // 2. Llamar función SQL que actualiza inventario y kardex
    const {error:e2}=await sb.rpc("process_crypto_purchase",{
      p_id:data.id, p_user_id:data.user_id,
      p_date:data.date, p_symbol:data.symbol,
      p_quantity:data.quantity, p_cost:data.unit_cost, p_total:data.total
    });
    if(e2) throw e2;

    // 3. Registrar en flujo de caja automáticamente
    await sb.from("cash_flow").insert({
      date:p.date, type:"egreso",
      description:`Compra ${p.quantity} ${p.symbol} @ ${fmt(+p.unit_cost)}`,
      amount:+p.quantity*+p.unit_cost, method:p.pay_method||"transferencia",
      notes:`Proveedor: ${p.supplier||"—"}`
    });

    return data;
  },

  // ── Ventas crypto ───────────────────────────────────────
  async getCryptoSales(){
    const {data,error}=await sb.from("crypto_sales").select("*").order("date",{ascending:false});
    if(error) throw error;
    return data||[];
  },
  async addCryptoSale(s){
    // 1. Insertar venta (avg_cost_used, cogs, gross_profit los calcula la función)
    const {data,error}=await sb.from("crypto_sales").insert({
      date:s.date, symbol:s.symbol, quantity:+s.quantity,
      unit_price:+s.unit_price, total:+s.quantity*+s.unit_price,
      avg_cost_used:0, cogs:0, gross_profit:0,
      currency:s.currency||"COP", client:s.client,
      pay_method:s.pay_method, notes:s.notes
    }).select().single();
    if(error) throw error;

    // 2. Llamar función SQL que calcula utilidad y actualiza inventario
    const {data:calc,error:e2}=await sb.rpc("process_crypto_sale",{
      p_id:data.id, p_user_id:data.user_id,
      p_date:data.date, p_symbol:data.symbol,
      p_quantity:data.quantity, p_price:data.unit_price, p_total:data.total
    });
    if(e2) throw e2;

    // 3. Registrar en flujo de caja automáticamente
    await sb.from("cash_flow").insert({
      date:s.date, type:"ingreso",
      description:`Venta ${s.quantity} ${s.symbol} @ ${fmt(+s.unit_price)}`,
      amount:+s.quantity*+s.unit_price, method:s.pay_method||"transferencia",
      notes:`Cliente: ${s.client||"—"}`
    });

    return {...data,...(calc?.[0]||{})};
  },

  // ── Kardex ──────────────────────────────────────────────
  async getKardex(symbol){
    let q=sb.from("crypto_kardex").select("*").order("created_at",{ascending:false});
    if(symbol&&symbol!=="all") q=q.eq("symbol",symbol);
    const {data,error}=await q;
    if(error) throw error;
    return data||[];
  },

  // ── Dashboard crypto ────────────────────────────────────
  async getCryptoDashboard(){
    const todayStr=new Date().toISOString().split("T")[0];
    const monthStr=todayStr.slice(0,7);
    const [inv,todaySales,monthSales]=await Promise.all([
      sb.from("crypto_inventory_view").select("*"),
      sb.from("crypto_sales").select("gross_profit,total,symbol").eq("date",todayStr),
      sb.from("crypto_sales").select("gross_profit,total,cogs,symbol").gte("date",monthStr+"-01"),
    ]);
    return {
      inventory: inv.data||[],
      todayProfit: (todaySales.data||[]).reduce((a,s)=>a+s.gross_profit,0),
      todayRevenue:(todaySales.data||[]).reduce((a,s)=>a+s.total,0),
      monthProfit: (monthSales.data||[]).reduce((a,s)=>a+s.gross_profit,0),
      monthRevenue:(monthSales.data||[]).reduce((a,s)=>a+s.total,0),
      monthCogs:   (monthSales.data||[]).reduce((a,s)=>a+s.cogs,0),
    };
  }
};

// ═══════════════════════════════════════════════════════════════════════════
const NAV=[
  {id:"dashboard",  icon:"📊", label:"Dashboard",      g:"Principal"},
  {id:"sales",      icon:"💰", label:"Ventas",          g:"Principal"},
  {id:"portfolio",  icon:"📋", label:"Cartera",         g:"Principal"},
  {id:"clients",    icon:"👥", label:"Clientes",        g:"Contactos"},
  {id:"suppliers",  icon:"🏭", label:"Proveedores",     g:"Contactos"},
  {id:"purchases",  icon:"🛒", label:"Compras",         g:"Operaciones"},
  {id:"expenses",   icon:"💸", label:"Gastos",          g:"Operaciones"},
  {id:"inventory",  icon:"📦", label:"Inventario",      g:"Operaciones"},
  {id:"cashflow",   icon:"💳", label:"Flujo de Caja",   g:"Finanzas"},
  {id:"profits",    icon:"📈", label:"Ganancias",       g:"Finanzas"},
  // ── Casa de Cambio Digital ──────────────────────────────
  {id:"crypto_purchases", icon:"⬇️", label:"Compras Crypto",  g:"Casa de Cambio"},
  {id:"crypto_sales",     icon:"⬆️", label:"Ventas Crypto",   g:"Casa de Cambio"},
  {id:"crypto_inventory", icon:"₿",  label:"Inventario Crypto",g:"Casa de Cambio"},
  {id:"crypto_profits",   icon:"💹", label:"Rentabilidad",    g:"Casa de Cambio"},
];
const NAV_GROUPS=["Principal","Contactos","Operaciones","Finanzas","Casa de Cambio"];

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [active,setActive]=useState("dashboard");
  const [sidebar,setSidebar]=useState(false);
  const [loading,setLoading]=useState(true);
  const {toasts,show:toast,remove}=useToast();

  // Estado existente (sin cambios)
  const [sales,setSales]=useState([]);
  const [clients,setClients]=useState([]);
  const [products,setProducts]=useState([]);
  const [expenses,setExpenses]=useState([]);
  const [suppliers,setSuppliers]=useState([]);
  const [purchases,setPurchases]=useState([]);
  const [cashflow,setCashflow]=useState([]);

  // Cargar datos al iniciar (misma lógica, sin cambios)
  const loadData=async()=>{
    try{
      const [cl,pr,sa,ex,su,pu,cf]=await Promise.all([
        api.getClients(),api.getProducts(),api.getSales(),
        api.getExpenses(),api.getSuppliers(),api.getPurchases(),api.getCashFlow()
      ]);
      setClients(cl);setProducts(pr);setSales(sa);
      setExpenses(ex);setSuppliers(su);setPurchases(pu);setCashflow(cf);
    }catch(e){toast("Error cargando datos: "+e.message,"error");}
    finally{setLoading(false);}
  };

  const handleLogin=async(u)=>{
    setUser(u);
    setLoading(true);
    await loadData();
  };

  const W=typeof window!=="undefined"?window.innerWidth:1024;
  const isMobile=W<768;
  const SW=230;

  if(!user) return React.createElement(Login,{onLogin:handleLogin});

  const props={sales,setSales,clients,setClients,products,setProducts,
    expenses,setExpenses,suppliers,setSuppliers,purchases,setPurchases,
    cashflow,setCashflow,toast};

  const module=()=>{
    if(loading) return React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:200,color:C.muted}},"Cargando...");
    switch(active){
      // Módulos existentes — sin cambios
      case "dashboard":  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:20}},
        React.createElement(Dashboard,props),
        React.createElement(CryptoDashboardPanel,null)
      );
      case "sales":      return React.createElement(SalesModule,props);
      case "portfolio":  return React.createElement(PortfolioModule,props);
      case "clients":    return React.createElement(ClientsModule,props);
      case "suppliers":  return React.createElement(SuppliersModule,props);
      case "purchases":  return React.createElement(PurchasesModule,props);
      case "expenses":   return React.createElement(ExpensesModule,props);
      case "inventory":  return React.createElement(InventoryModule,props);
      case "cashflow":   return React.createElement(CashFlowModule,props);
      case "profits":    return React.createElement(ProfitModule,props);
      // Módulos nuevos Casa de Cambio
      case "crypto_purchases": return React.createElement(CryptoPurchasesModule,{suppliers,toast});
      case "crypto_sales":     return React.createElement(CryptoSalesModule,{clients,toast});
      case "crypto_inventory": return React.createElement(CryptoInventoryModule,{toast});
      case "crypto_profits":   return React.createElement(CryptoProfitModule,{toast});
      default: return null;
    }
  };

  const navItem=NAV.find(n=>n.id===active)||NAV[0];

  return React.createElement("div",{style:{minHeight:"100vh",background:C.bg,fontFamily:"'Inter',system-ui,sans-serif",color:C.text,display:"flex"}},
    sidebar&&React.createElement("div",{onClick:()=>setSidebar(false),style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:40}}),

    // Sidebar
    React.createElement("nav",{style:{width:SW,background:C.panel,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",position:"fixed",top:0,bottom:0,left:0,zIndex:50,transform:isMobile?`translateX(${sidebar?0:-SW}px)`:"none",transition:"transform .25s"}},
      React.createElement("div",{style:{padding:"18px 14px 12px",borderBottom:`1px solid ${C.border}`}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
          React.createElement("span",{style:{fontSize:24}},"₿"),
          React.createElement("div",null,
            React.createElement("div",{style:{fontSize:13,fontWeight:800,color:C.text}},"Libro Empresarial"),
            React.createElement("div",{style:{fontSize:10,color:C.muted}},user.name||user.email)
          )
        )
      ),
      React.createElement("div",{style:{flex:1,overflowY:"auto",padding:"6px 8px"}},
        NAV_GROUPS.map(g=>React.createElement("div",{key:g,style:{marginBottom:6}},
          React.createElement("div",{style:{
            fontSize:9,color:g==="Casa de Cambio"?C.amber:C.slate,
            textTransform:"uppercase",letterSpacing:1,padding:"6px 12px 3px",fontWeight:700
          }},g==="Casa de Cambio"?"₿ "+g:g),
          NAV.filter(n=>n.g===g).map(n=>React.createElement("button",{key:n.id,
            onClick:()=>{setActive(n.id);setSidebar(false);},
            style:{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"8px 12px",
              background:active===n.id?`${C.accent}1A`:"transparent",
              border:`1px solid ${active===n.id?C.accent:"transparent"}`,
              borderRadius:8,cursor:"pointer",textAlign:"left",marginBottom:1,
              color:active===n.id?C.accentL:C.muted,fontSize:13,fontWeight:active===n.id?600:400}},
            React.createElement("span",{style:{fontSize:14}},n.icon),n.label
          ))
        ))
      ),
      React.createElement("div",{style:{padding:"10px 14px",borderTop:`1px solid ${C.border}`}},
        React.createElement("div",{style:{fontSize:11,color:C.muted,marginBottom:7}},`👤 ${user.role==="admin"?"Admin":"Empleado"}`),
        React.createElement("button",{
          onClick:async()=>{
            await api.logout();
            setUser(null);
            setSales([]);setClients([]);setProducts([]);
            setExpenses([]);setSuppliers([]);setPurchases([]);setCashflow([]);
          },
          style:{width:"100%",padding:"7px",background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,cursor:"pointer",fontSize:12}
        },"Cerrar sesión")
      )
    ),

    // Main
    React.createElement("div",{style:{marginLeft:isMobile?0:SW,flex:1,display:"flex",flexDirection:"column",minHeight:"100vh"}},
      React.createElement("header",{style:{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"0 16px",height:50,display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:30}},
        isMobile&&React.createElement("button",{onClick:()=>setSidebar(s=>!s),style:{background:"none",border:"none",color:C.muted,fontSize:20,cursor:"pointer",padding:4}},"☰"),
        React.createElement("span",{style:{fontSize:15}},navItem.icon),
        React.createElement("h2",{style:{margin:0,fontSize:15,fontWeight:700,color:C.text,flex:1}},navItem.label),
        React.createElement("div",{style:{fontSize:11,color:C.muted}},new Date().toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"}))
      ),
      React.createElement("main",{style:{flex:1,padding:"18px 16px 40px",maxWidth:1400,width:"100%",margin:"0 auto",boxSizing:"border-box"}},
        module()
      )
    ),

    toasts.map(t=>React.createElement(Toast,{key:t.id,msg:t.msg,type:t.type,onDone:()=>remove(t.id)}))
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
