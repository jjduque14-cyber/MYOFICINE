// ─── Ledger & client stats ─────────────────────────────────────────────
function buildLedger(name,sales,purchases,payments){
  const n=norm(name),rows=[];
  sales.filter(s=>norm(s.client)===n).forEach(s=>rows.push({id:"v"+s.id,date:s.date,ts:s.created_at||"",doc:`VTA-${s.id.slice(-6).toUpperCase()}`,concept:`Venta ${fmtQ(s.quantity,s.symbol)} ${s.symbol} @ ${fmt(s.unit_price)}`,debit:+s.total,credit:0,kind:"venta",receipt:s.receipt_url}));
  purchases.filter(p=>norm(p.supplier)===n).forEach(p=>rows.push({id:"c"+p.id,date:p.date,ts:p.created_at||"",doc:`CMP-${p.id.slice(-6).toUpperCase()}`,concept:`Compra ${fmtQ(p.quantity,p.symbol)} ${p.symbol} @ ${fmt(p.unit_cost)}`,debit:0,credit:+p.total,kind:"compra",receipt:p.receipt_url}));
  payments.filter(p=>norm(p.party)===n).forEach(p=>rows.push({id:"p"+p.id,date:p.date,ts:p.created_at||"",doc:`PAG-${p.id.slice(-6).toUpperCase()}`,concept:(p.direction==="recibido"?"Pago recibido":"Pago realizado")+(p.notes?` · ${p.notes}`:""),debit:p.direction==="realizado"?+p.amount:0,credit:p.direction==="recibido"?+p.amount:0,kind:"pago",receipt:p.receipt_url}));
  rows.sort((a,b)=>a.date===b.date?String(a.ts).localeCompare(String(b.ts)):a.date.localeCompare(b.date));
  let saldo=0;rows.forEach(r=>{saldo+=r.debit-r.credit;r.saldo=saldo;});
  return rows;
}
function clientStats(client,sales,purchases,payments){
  const n=norm(client.name);
  const vs=sales.filter(s=>norm(s.client)===n);
  const cs=purchases.filter(p=>norm(p.supplier)===n);
  const ps=payments.filter(p=>norm(p.party)===n);
  const ledger=buildLedger(client.name,sales,purchases,payments);
  const saldo=ledger.length?ledger[ledger.length-1].saldo:0;
  const totalVendido=vs.reduce((a,s)=>a+s.total,0);
  const totalComprado=cs.reduce((a,p)=>a+p.total,0);
  const volCOP=totalVendido+totalComprado;
  const volBySym={};[...vs,...cs].forEach(o=>volBySym[o.symbol]=(volBySym[o.symbol]||0)+ +o.quantity);
  const profit=vs.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const ops=vs.length+cs.length;
  const dates=[...vs,...cs].map(o=>o.date).sort();
  const first=dates[0]||null,last=dates[dates.length-1]||null;
  const daysSince=last?dBetween(last,today()):null;
  const since=client.created_at?client.created_at.slice(0,10):first;
  const months=first?Math.max(1,Math.round(dBetween(first,today())/30)):1;
  const profits=vs.map(s=>(+s.gross_profit||0));
  return{vs,cs,ps,ledger,saldo,totalVendido,totalComprado,volCOP,volBySym,profit,ops,first,last,since,daysSince,
    ticket:ops>0?volCOP/ops:0,freqV:(vs.length/months).toFixed(1),freqC:(cs.length/months).toFixed(1),
    totalCobrado:ps.filter(p=>p.direction==="recibido").reduce((a,p)=>a+ +p.amount,0),
    totalPagado:ps.filter(p=>p.direction==="realizado").reduce((a,p)=>a+ +p.amount,0),
    porCobrar:vs.reduce((a,s)=>a+pendOf(s),0),porPagar:cs.reduce((a,p)=>a+pendOf(p),0),
    bestOp:profits.length?Math.max(...profits):0,worstOp:profits.length?Math.min(...profits):0,
    avgProfit:profits.length?profit/profits.length:0,
  };
}

function Spark({data,color=C.accent,h=34,w=80}){
  if(!data||data.length<2)return null;
  const min=Math.min(...data),max=Math.max(...data),r=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/r)*(h-6)-3}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{flexShrink:0}}>

// ─── DASHBOARD ────────────────────────────────────────────────────────────
function Dashboard({inventory,sales,purchases,cashflow,clients,payments,goals,expenses,setActive}){
  const[rank,setRank]=useState("profit");

  const capital=cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0);
  const usdtInv=inventory.find(i=>i.symbol==="USDT");
  const totalInv=inventory.reduce((a,i)=>a+(+i.total_invested||0),0);

  const tot=arr=>arr.reduce((a,s)=>a+(+s.total||0),0);
  const profit=arr=>arr.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const inArr=(arr,p)=>arr.filter(x=>inP(x.date,p));

  const dS=inArr(sales,"today"),wS=inArr(sales,"week"),mS=inArr(sales,"month"),yS=inArr(sales,"year");
  const dP=inArr(purchases,"today"),mP=inArr(purchases,"month");

  const porCobrar=sales.reduce((a,s)=>a+pendOf(s),0);
  const porPagar=purchases.reduce((a,p)=>a+pendOf(p),0);
  const vencidos=sales.filter(s=>stOf(s)==="vencido");

  const activos=new Set();
  [...sales,...purchases].forEach(o=>{const n=o.client||o.supplier;if(n&&dBetween(o.date,today())<=30)activos.add(norm(n));});

  // USDT spread mes
  const mPU=mP.filter(p=>p.symbol==="USDT"),mSU=mS.filter(s=>s.symbol==="USDT");
  const avgBuy=mPU.reduce((a,p)=>a+ +p.quantity,0)>0?tot(mPU)/mPU.reduce((a,p)=>a+ +p.quantity,0):0;
  const avgSell=mSU.reduce((a,s)=>a+ +s.quantity,0)>0?tot(mSU)/mSU.reduce((a,s)=>a+ +s.quantity,0):0;
  const spread=avgBuy>0&&avgSell>0?avgSell-avgBuy:0;

  // Series 14 días
  const last14=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(13-i));return d.toISOString().split("T")[0];});
  const profitSeries=last14.map(d=>profit(sales.filter(s=>s.date===d)));
  const volSeries=last14.map(d=>tot(sales.filter(s=>s.date===d))/1e6);
  const dayLbls=last14.map(d=>d.slice(8));

  // Rankings
  const byC={};
  sales.forEach(s=>{const k=norm(s.client)||"anon";if(!byC[k])byC[k]={name:s.client||"(sin nombre)",profit:0,vol:0,ops:0,buys:0,sells:0};byC[k].profit+=(+s.gross_profit||0);byC[k].vol+=s.total;byC[k].ops++;byC[k].sells+=s.total;});
  purchases.forEach(p=>{const k=norm(p.supplier)||"anon";if(!byC[k])byC[k]={name:p.supplier||"(sin nombre)",profit:0,vol:0,ops:0,buys:0,sells:0};byC[k].vol+=p.total;byC[k].ops++;byC[k].buys+=p.total;});
  const rankKey=rank;
  const top5=Object.values(byC).sort((a,b)=>b[rankKey]-a[rankKey]).slice(0,5);
  const rFmt=v=>rank==="ops"?v:fmtK(v);
  const topMax=top5[0]?.[rankKey]||1;

  // Alertas inteligentes
  const mGoal=goals.find(g=>g.month===mKey());
  const mExp=expenses.filter(e=>e.date.slice(0,7)===mKey()).reduce((a,e)=>a+e.amount,0);
  const avgTick=sales.length?tot(sales)/sales.length:0;
  const bigOps=[...sales,...purchases].filter(o=>dBetween(o.date,today())<=3&&o.total>=Math.max(100e6,avgTick*5));
  const alerts=[];
  if(vencidos.length)alerts.push({c:C.rose,icon:"🔴",msg:`${vencidos.length} cuenta(s) VENCIDA(S) · ${fmt(vencidos.reduce((a,s)=>a+pendOf(s),0))}`,go:"cartera"});
  if(capital<0)alerts.push({c:C.rose,icon:"⚠️",msg:`Caja negativa: ${fmt(capital)}`,go:"cash"});
  if(porCobrar>0&&!vencidos.length)alerts.push({c:C.amber,icon:"🟡",msg:`Por cobrar: ${fmt(porCobrar)}`,go:"cartera"});
  if(porPagar>0)alerts.push({c:C.blue,icon:"🔵",msg:`Por pagar proveedores: ${fmt(porPagar)}`,go:"cartera"});
  if(usdtInv&&+usdtInv.quantity<=0)alerts.push({c:C.rose,icon:"📉",msg:"Sin inventario USDT",go:"buy"});
  if(bigOps.length)alerts.push({c:C.purple,icon:"💎",msg:`${bigOps.length} operación(es) inusual(es) (últimas 72h)`,go:"sell"});
  if(mGoal&&+mGoal.profit_goal>0){const pct=profit(mS)/+mGoal.profit_goal*100;const dayPct=new Date().getDate()/new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()*100;
    if(pct>=90&&pct<100)alerts.push({c:C.green,icon:"🎯",msg:`Meta utilidad: ${Math.round(pct)}% · ¡casi!`,go:"goals"});
    else if(pct<dayPct-30)alerts.push({c:C.amber,icon:"⏳",msg:`Meta atrasada: ${Math.round(pct)}% (esperado ${Math.round(dayPct)}%)`,go:"goals"});
  }

  const gW="repeat(auto-fit,minmax(145px,1fr))";

  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    {/* Alertas */}
    {alerts.length>0&&<div style={{display:"flex",flexDirection:"column",gap:5}}>
      {alerts.map((a,i)=><button key={i} onClick={()=>setActive(a.go)} style={{display:"flex",alignItems:"center",gap:10,background:`${a.c}12`,border:`1px solid ${a.c}40`,borderRadius:8,padding:"9px 13px",color:C.text,fontSize:12,cursor:"pointer",textAlign:"left"}}>
        <span>{a.icon}</span><span style={{flex:1}}>{a.msg}</span><span style={{color:a.c,fontSize:10}}>Ver →</span>
      </button>)}
    </div>}

    {/* KPI Financiero */}
    <div style={{display:"grid",gridTemplateColumns:gW,gap:8}}>
      <Stat label="Capital Disponible" value={fmtK(capital)} accent={capital>=0?C.accentL:C.rose} sub="caja actual"/>
      <Stat label="Inventario USDT" value={fmtQ(usdtInv?.quantity||0,"USDT")} accent={COIN_C.USDT} sub={usdtInv?`CPP ${fmt(usdtInv.avg_cost)}`:"sin stock"}/>
      <Stat label="Valor Inventario" value={fmtK(totalInv)} accent={C.amber} sub="COP invertidos"/>
      <Stat label="Por Cobrar" value={fmtK(porCobrar)} accent={porCobrar>0?C.amber:C.muted} sub={`${sales.filter(s=>pendOf(s)>0.01).length} cuentas`} onClick={()=>setActive("cartera")}/>
      <Stat label="Por Pagar" value={fmtK(porPagar)} accent={porPagar>0?C.rose:C.muted} sub={`${purchases.filter(p=>pendOf(p)>0.01).length} cuentas`} onClick={()=>setActive("cartera")}/>
      <Stat label="Clientes Activos" value={activos.size} sub="últimos 30 días" onClick={()=>setActive("clients")}/>
    </div>

    {/* Utilidades */}
    <div style={{display:"grid",gridTemplateColumns:gW,gap:8}}>
      <Stat label="Utilidad Hoy" value={fmtK(profit(dS))} accent={profit(dS)>=0?C.green:C.rose} sub={`${dS.length}v · ${dP.length}c`}/>
      <Stat label="Utilidad Semana" value={fmtK(profit(wS))} accent={C.green}/>
      <Stat label="Utilidad Mes" value={fmtK(profit(mS))} accent={C.green} spark={profitSeries} sparkColor={C.green}/>
      <Stat label="Utilidad Neta Mes" value={fmtK(profit(mS)-mExp)} accent={profit(mS)-mExp>=0?C.accentL:C.rose} sub={`gastos: ${fmtK(mExp)}`}/>
      <Stat label="Volumen Hoy" value={fmtK(tot(dS)+tot(dP))} accent={C.blue} sub={`${dS.length+dP.length} ops`}/>
      <Stat label="Volumen Mes" value={fmtK(tot(mS)+tot(mP))} accent={C.blue} spark={volSeries} sparkColor={C.blue}/>
    </div>

    {/* USDT indicators */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(145px,1fr))",gap:8}}>
      <Stat small label="Precio Compra USDT" value={avgBuy>0?fmt(avgBuy):"—"} sub="promedio mes"/>
      <Stat small label="Precio Venta USDT" value={avgSell>0?fmt(avgSell):"—"} sub="promedio mes"/>
      <Stat small label="Spread" value={spread>0?fmt(spread):"—"} accent={C.accentL} sub={spread>0&&avgBuy>0?`${((spread/avgBuy)*100).toFixed(2)}%`:""}/>
      <Stat small label="Utilidad Año" value={fmtK(profit(inArr(sales,"year")))} accent={C.accentL}/>
      <Stat small label="Utilidad Acumulada" value={fmtK(profit(sales))} accent={C.green} sub="histórica"/>
      <Stat small label="Margen Mes" value={`${tot(mS)>0?((profit(mS)/tot(mS))*100).toFixed(2):0}%`} accent={C.accentL}/>
    </div>

    {/* Gráficas + Rankings */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(270px,1fr))",gap:12}}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16}}>
        <h4 style={{margin:"0 0 4px",fontSize:13,fontWeight:600}}>Volumen de Ventas</h4>
        <p style={{margin:"0 0 10px",fontSize:10,color:C.muted}}>Últimos 14 días (M COP)</p>

// ─── TESORERÍA ────────────────────────────────────────────────────────────
function TreasuryModule({reload,toast}){
  const[accounts,setAccounts]=useState([]);const[moves,setMoves]=useState([]);
  const[modal,setModal]=useState(false);const[movModal,setMovModal]=useState(false);
  const[loading,setLoading]=useState(true);
  const empty={name:"",type:"efectivo",balance:"",currency:"COP",color:"#26A17B",notes:""};
  const emptyMov={date:today(),from_id:"",to_id:"",amount:"",type:"ingreso",description:"",method:"transferencia"};
  const[form,setForm]=useState(empty);const[movForm,setMovForm]=useState(emptyMov);const[saving,setSaving]=useState(false);
  const fa=k=>v=>setForm(p=>({...p,[k]:v}));const fm=k=>v=>setMovForm(p=>({...p,[k]:v}));

  const load=async()=>{
    setLoading(true);
    try{const[acc,mvs]=await Promise.all([api.getTreasury(),api.getTreasuryMoves()]);setAccounts(acc||[]);setMoves(mvs||[]);}
    catch{}finally{setLoading(false);}
  };
  useEffect(()=>{load();},[]);

  const totalCOP=accounts.filter(a=>a.currency==="COP").reduce((a,x)=>a+x.balance,0);

  const saveAcc=async()=>{
    if(!form.name){toast("Nombre requerido","error");return;}
    setSaving(true);
    try{await api.addTreasury({...form,balance:+form.balance||0});await load();setModal(false);setForm(empty);toast("Cuenta creada");}
    catch(e){toast(e.message,"error");}finally{setSaving(false);}
  };
  const saveMov=async()=>{
    if(!movForm.amount||+movForm.amount<=0){toast("Valor inválido","error");return;}
    setSaving(true);
    try{
      await api.addTreasuryMove({...movForm,amount:+movForm.amount,from_id:movForm.from_id||null,to_id:movForm.to_id||null});
      // Actualizar saldos
      if(movForm.type==="ingreso"&&movForm.to_id){const acc=accounts.find(a=>a.id===movForm.to_id);if(acc)await api.updateTreasury(movForm.to_id,{balance:acc.balance+ +movForm.amount});}
      if(movForm.type==="egreso"&&movForm.from_id){const acc=accounts.find(a=>a.id===movForm.from_id);if(acc)await api.updateTreasury(movForm.from_id,{balance:acc.balance- +movForm.amount});}
      if(movForm.type==="transferencia"&&movForm.from_id&&movForm.to_id){
        const from=accounts.find(a=>a.id===movForm.from_id),to=accounts.find(a=>a.id===movForm.to_id);
        if(from)await api.updateTreasury(movForm.from_id,{balance:from.balance- +movForm.amount});
        if(to)await api.updateTreasury(movForm.to_id,{balance:to.balance+ +movForm.amount});
      }
      await load();setMovModal(false);setMovForm(emptyMov);toast("Movimiento registrado");
    }catch(e){toast(e.message,"error");}finally{setSaving(false);}
  };

  const movCols=[
    {key:"date",label:"Fecha"},{key:"type",label:"Tipo",render:v=><span style={{color:v==="ingreso"?C.green:v==="egreso"?C.rose:C.blue,fontWeight:700,fontSize:10,textTransform:"uppercase"}}>{v}</span>},
    {key:"description",label:"Descripción"},{key:"method",label:"Método"},
    {key:"amount",label:"Valor",render:v=><b>{fmt(v)}</b>},
    {key:"from",label:"De",render:v=>v?.name||"—"},{key:"to",label:"A",render:v=>v?.name||"—"},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Head title="Tesorería" sub="bolsillos de caja y movimientos"
      extra={<React.Fragment><Btn small variant="sec" onClick={()=>setMovModal(true)} icon="↔️">Movimiento</Btn></React.Fragment>}
      action="Nueva Cuenta" onAction={()=>setModal(true)}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8}}>
      <Stat small label="Total COP" value={fmtK(totalCOP)} accent={C.accentL}/>
      <Stat small label="Cuentas" value={accounts.length}/>
    </div>
    {loading?<div style={{padding:24,textAlign:"center",color:C.muted}}>Cargando...</div>:<React.Fragment>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {accounts.map(a=><div key={a.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 16px",minWidth:160}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
            <span style={{fontSize:18}}>{TREAS_ICONS[a.type]||"💳"}</span>
            <div><div style={{fontWeight:600,fontSize:13}}>{a.name}</div><div style={{fontSize:9,color:C.muted,textTransform:"uppercase"}}>{a.type}</div></div>
          </div>
          <div style={{fontSize:20,fontWeight:700,color:a.balance>=0?C.accentL:C.rose,fontFamily:"monospace"}}>{fmt(a.balance)}</div>
        </div>)}
        {accounts.length===0&&<p style={{color:C.muted,fontSize:12}}>Sin cuentas. Crea la primera.</p>}
      </div>
      <Tabla cols={movCols} rows={moves} emptyMsg="Sin movimientos"/>
    </React.Fragment>}

    {modal&&<Modal title="Nueva Cuenta" onClose={()=>{setModal(false);setForm(empty);}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <Inp label="Nombre" value={form.name} onChange={fa("name")} placeholder="Ej: Caja Principal"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <Sel label="Tipo" value={form.type} onChange={fa("type")} options={TREAS_TYPES.map(t=>({value:t,label:`${TREAS_ICONS[t]} ${t.charAt(0).toUpperCase()+t.slice(1)}`}))}/>
          <Inp label="Saldo inicial" type="number" value={form.balance} onChange={fa("balance")} placeholder="0"/>
        </div>
        <Inp label="Notas" value={form.notes} onChange={fa("notes")}/>
        <Btn onClick={saveAcc} disabled={saving} full>{saving?"Guardando...":"Crear Cuenta"}</Btn>
      </div>
    </Modal>}

    {movModal&&<Modal title="Registrar Movimiento" onClose={()=>{setMovModal(false);setMovForm(emptyMov);}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <Inp label="Fecha" type="date" value={movForm.date} onChange={fm("date")}/>
          <Sel label="Tipo" value={movForm.type} onChange={fm("type")} options={[{value:"ingreso",label:"💰 Ingreso"},{value:"egreso",label:"💸 Egreso"},{value:"transferencia",label:"↔️ Transferencia"}]}/>
        </div>
        {(movForm.type==="egreso"||movForm.type==="transferencia")&&<Sel label="Cuenta origen" value={movForm.from_id} onChange={fm("from_id")} options={[{value:"",label:"Seleccionar..."},...accounts.map(a=>({value:a.id,label:`${TREAS_ICONS[a.type]} ${a.name} · ${fmt(a.balance)}`}))]}/>}
        {(movForm.type==="ingreso"||movForm.type==="transferencia")&&<Sel label="Cuenta destino" value={movForm.to_id} onChange={fm("to_id")} options={[{value:"",label:"Seleccionar..."},...accounts.map(a=>({value:a.id,label:`${TREAS_ICONS[a.type]} ${a.name} · ${fmt(a.balance)}`}))]}/>}
        <Inp label="Valor" type="number" value={movForm.amount} onChange={fm("amount")}/>
        <Inp label="Descripción" value={movForm.description} onChange={fm("description")}/>
        <Btn onClick={saveMov} disabled={saving} full>{saving?"Guardando...":"Registrar"}</Btn>
      </div>
    </Modal>}
  </div>;
}

function ClientFormModal({client,onClose,reload,toast}){
  const[form,setForm]=useState(client?{name:client.name||"",document:client.document||"",phone:client.phone||"",email:client.email||"",city:client.city||"",address:client.address||"",notes:client.notes||"",status:client.status||"activo",tags:client.tags||[]}:{name:"",document:"",phone:"",email:"",city:"",address:"",notes:"",status:"activo",tags:[]});

        <Inp label="Teléfono" value={form.phone} onChange={f("phone")}/>

        <Sel label="Estado" value={form.status} onChange={f("status")} options={[{value:"activo",label:"🟢 Activo"},{value:"inactivo",label:"⚪ Inactivo"}]}/>
      </div>

            <Stat small label="Total Pagado" value={fmtK(st.totalPagado)} accent={C.rose}/>

            <Btn variant="sec" small onClick={()=>setPayCtx({title:"Recibir Pago",party:client.name,direction:"recibido",maxAmount:st.porCobrar})}>💰 Recibir Pago</Btn>
            <Btn variant="sec" small onClick={()=>setPayCtx({title:"Realizar Pago",party:client.name,direction:"realizado",maxAmount:st.porPagar})}>💸 Pagar</Btn>

        {/* LIBRO MAYOR */}
        {tab==="libro"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>

        {/* OPERACIONES */}
        {tab==="ops"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
          <Tabla cols={opCols} rows={ops} emptyMsg="Sin operaciones"/>
        </div>}

        {/* RENTABILIDAD */}
        {tab==="profit"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>

            <Stat small label="Utilidad Prom." value={fmtK(st.avgProfit)} accent={C.accentL}/>

            {profByMo.some(v=>v>0)?<Bars data={profByMo.map(v=>Math.max(0,v))} labels={mLbls} color={C.green} h={80}/>:<p style={{color:C.muted,fontSize:11,margin:0}}>Sin utilidades</p>}
          </div>
        </div>}
      </div>
    </Modal>

    {payCtx&&<PaymentModal ctx={payCtx} onClose={()=>setPayCtx(null)} reload={reload} toast={toast}/>}

    {printing&&<div id="print-area" style={{position:"fixed",inset:0,background:"#fff",color:"#111",zIndex:1000,overflowY:"auto",padding:28,fontFamily:"Inter,sans-serif"}}>
      <div className="no-print" style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={()=>window.print()} style={{padding:"8px 16px",background:"#26A17B",color:"#fff",border:"none",borderRadius:7,fontWeight:600,cursor:"pointer"}}>🖨️ Imprimir / PDF</button>
        <button onClick={()=>setPrinting(false)} style={{padding:"8px 16px",background:"#eee",color:"#111",border:"none",borderRadius:7,fontWeight:600,cursor:"pointer"}}>Cerrar</button>
      </div>
      <h1 style={{margin:"0 0 2px",fontSize:20}}>Estado de Cuenta · {client.name}</h1>
      <p style={{margin:"0 0 12px",fontSize:11,color:"#666"}}>Generado: {new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})} · Casa de Cambio Pro 3.0</p>
      <div style={{display:"flex",gap:18,flexWrap:"wrap",marginBottom:14,fontSize:12}}>
        <span><b>Ops:</b> {st.ops}</span><span><b>Vol:</b> {fmt(st.volCOP)}</span><span><b>USDT:</b> {fmtQ(st.volBySym.USDT||0,"USDT")}</span>
        <span><b>Saldo:</b> {Math.abs(st.saldo)<0.01?"Al día":`${fmt(Math.abs(st.saldo))} ${st.saldo>0?"(nos debe)":"(a su favor)"}`}</span>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
        <thead><tr style={{background:"#f3f3f3"}}>{["Fecha","Documento","Concepto","Débito","Crédito","Saldo"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",borderBottom:"2px solid #ddd"}}>{h}</th>)}</tr></thead>
        <tbody>{ledger.map(r=><tr key={r.id}><td style={{padding:"5px 8px",borderBottom:"1px solid #eee"}}>{r.date}</td><td style={{padding:"5px 8px",borderBottom:"1px solid #eee",fontFamily:"monospace",fontSize:9}}>{r.doc||""}</td><td style={{padding:"5px 8px",borderBottom:"1px solid #eee"}}>{r.concept}</td><td style={{padding:"5px 8px",borderBottom:"1px solid #eee"}}>{r.debit?fmt(r.debit):""}</td><td style={{padding:"5px 8px",borderBottom:"1px solid #eee"}}>{r.credit?fmt(r.credit):""}</td><td style={{padding:"5px 8px",borderBottom:"1px solid #eee",fontWeight:600}}>{fmt(r.saldo)}</td></tr>)}</tbody>
      </table>
    </div>}
  </React.Fragment>;
}

function ClientsModule({clients,sales,purchases,payments,reload,toast}){
  const[search,setSearch]=useState("");const[sort,setSort]=useState("profit");const[tagF,setTagF]=useState("all");
  const[formModal,setFormModal]=useState(false);const[editC,setEditC]=useState(null);const[detail,setDetail]=useState(null);

  const enriched=useMemo(()=>clients.map(c=>{
    const st=clientStats(c,sales,purchases,payments);
    return{...c,_ops:st.ops,_vol:st.volCOP,_profit:st.profit,_usdt:st.volBySym.USDT||0,_last:st.last,_saldo:st.saldo,_daysSince:st.daysSince};
  }),[clients,sales,purchases,payments]);

  const filtered=enriched.filter(c=>(norm(c.name).includes(norm(search))||norm(c.city).includes(norm(search))||norm(c.phone).includes(norm(search)))
    &&(tagF==="all"||(tagF==="activo"||tagF==="inactivo"?((c.status||"activo")===tagF):(c.tags||[]).includes(tagF))))
    .sort((a,b)=>sort==="profit"?b._profit-a._profit:sort==="vol"?b._vol-a._vol:sort==="ops"?b._ops-a._ops:a.name.localeCompare(b.name));

  const delClient=async r=>{if(!confirm(`¿Eliminar cliente ${r.name}?`))return;try{await api.deleteClient(r.id);await reload();toast("Cliente eliminado");}catch(e){toast(e.message,"error");};};
  const cols=[
    {key:"name",label:"Cliente",render:(v,r)=><div><b style={{fontSize:13}}>{v}</b><div style={{display:"flex",gap:3,marginTop:2}}>{(r.tags||[]).map(t=><Badge key={t} label={t} color={TAG_C[t]||C.slate}/>)}</div></div>},
    {key:"_ops",label:"Ops"},{key:"_vol",label:"Volumen",render:v=><span style={{color:C.blue,fontWeight:600}}>{fmtK(v)}</span>},
    {key:"_usdt",label:"USDT",render:v=><span style={{color:COIN_C.USDT,fontFamily:"monospace"}}>{fmtQ(v,"USDT")}</span>},
    {key:"_profit",label:"Utilidad",render:v=><b style={{color:v>=0?C.green:C.rose}}>{fmtK(v)}</b>},
    {key:"_saldo",label:"Saldo",render:v=>Math.abs(v)<0.01?<span style={{color:C.muted}}>Al día</span>:v>0?<Badge label={`Debe ${fmtK(v)}`} color={C.amber}/>:<Badge label={`Favor ${fmtK(-v)}`} color={C.blue}/>},
    {key:"_daysSince",label:"Inactividad",render:v=>v===null?"—":v===0?<span style={{color:C.green}}>Hoy</span>:v>30?<span style={{color:C.rose}}>{v}d</span>:`${v}d`},
    {key:"cacc",label:"",render:(_,r)=><button onClick={async e=>{e.stopPropagation();delClient(r);}} style={{fontSize:10,background:"#2D1218",border:`1px solid ${C.rose}`,color:C.rose,borderRadius:5,padding:"2px 8px",cursor:"pointer"}}>🗑</button>},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Head title="Clientes" sub={`${clients.length} registrados · toca para ver ficha completa`} action="Nuevo Cliente" onAction={()=>{setEditC(null);setFormModal(true);}}
      extra={<Btn small variant="sec" onClick={()=>exportCSV(["Nombre","Doc","Tel","Ciudad","Ops","VolCOP","USDT","Utilidad","Saldo","Última"],filtered.map(c=>[c.name,c.document||"",c.phone||"",c.city||"",c._ops,c._vol,c._usdt,c._profit,c._saldo,c._last||""]),`clientes-${today()}.csv`)}>📥 Excel</Btn>}/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:200,position:"relative"}}>
        <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:C.muted,fontSize:12}}>🔍</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar nombre, ciudad, teléfono..." style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 11px 8px 30px",color:C.text,fontSize:13,outline:"none",width:"100%"}}/>
      </div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        {[["profit","+ Rentables"],["vol","+ Volumen"],["ops","+ Activos"],["name","A-Z"]].map(([v,l])=><Pill key={v} label={l} active={sort===v} onClick={()=>setSort(v)}/>)}
      </div>
    </div>
    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      <Pill label="Todos" active={tagF==="all"} onClick={()=>setTagF("all")}/>
      {TAGS.map(t=><Pill key={t} label={t} active={tagF===t} onClick={()=>setTagF(t)} color={TAG_C[t]}/>)}
      <Pill label="Activos" active={tagF==="activo"} onClick={()=>setTagF("activo")} color={C.green}/>
      <Pill label="Inactivos" active={tagF==="inactivo"} onClick={()=>setTagF("inactivo")} color={C.slate}/>
    </div>
    <Tabla cols={cols} rows={filtered} onRowClick={setDetail} emptyMsg="Sin clientes"/>
    {formModal&&<ClientFormModal client={editC} onClose={()=>setFormModal(false)} reload={reload} toast={toast}/>}
    {detail&&<ClientFicha client={clients.find(c=>c.id===detail.id)||detail} sales={sales} purchases={purchases} payments={payments}
      onClose={()=>setDetail(null)} onEdit={()=>{setEditC(clients.find(c=>c.id===detail.id)||detail);setDetail(null);setFormModal(true);}}
      reload={reload} toast={toast}/>}
  </div>;
}

// ─── PROVEEDORES ──────────────────────────────────────────────────────────
function SuppliersModule({suppliers,purchases,reload,toast}){
  const[modal,setModal]=useState(false);const empty={name:"",contact:"",phone:"",notes:""};
  const[form,setForm]=useState(empty);const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const enriched=suppliers.map(s=>{const ops=purchases.filter(p=>norm(p.supplier)===norm(s.name));return{...s,_ops:ops.length,_vol:ops.reduce((a,p)=>a+p.total,0),_usdt:ops.filter(p=>p.symbol==="USDT").reduce((a,p)=>a+ +p.quantity,0),_pend:ops.reduce((a,p)=>a+pendOf(p),0)};}).sort((a,b)=>b._vol-a._vol);
  const[editRow,setEditRow]=useState(null);
  const openEdit=r=>{setEditRow(r);setForm({name:r.name||"",contact:r.contact||"",phone:r.phone||"",notes:r.notes||""});setModal(true);};
  const del=async r=>{if(!confirm(`¿Eliminar proveedor ${r.name}?`))return;try{await api.deleteSupplier(r.id);await reload();toast("Proveedor eliminado");}catch(e){toast(e.message,"error");};};
  const saveSup=async()=>{if(!form.name){toast("Nombre requerido","error");return;}try{if(editRow){await api.updateSupplier(editRow.id,form);toast("Proveedor actualizado");}else{await api.addSupplier(form);toast("Proveedor creado");}await reload();setModal(false);setEditRow(null);setForm(empty);}catch(e){toast(e.message,"error");};};
  const cols=[
    {key:"name",label:"Proveedor",render:v=><b>{v}</b>},{key:"phone",label:"Teléfono"},
    {key:"_ops",label:"Compras"},{key:"_vol",label:"Volumen",render:v=><span style={{color:C.amber,fontWeight:600}}>{fmtK(v)}</span>},
    {key:"_usdt",label:"USDT",render:v=><span style={{color:COIN_C.USDT,fontFamily:"monospace"}}>{fmtQ(v,"USDT")}</span>},
    {key:"_pend",label:"Le Debemos",render:v=>v>0.01?<b style={{color:C.rose}}>{fmt(v)}</b>:<span style={{color:C.muted}}>Al día</span>},
    {key:"acc",label:"",render:(_,r)=><div style={{display:"flex",gap:4}}><button onClick={e=>{e.stopPropagation();openEdit(r);}} style={{fontSize:10,background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:5,padding:"2px 8px",cursor:"pointer"}}>✏️</button><button onClick={e=>{e.stopPropagation();del(r);}} style={{fontSize:10,background:"#2D1218",border:`1px solid ${C.rose}`,color:C.rose,borderRadius:5,padding:"2px 8px",cursor:"pointer"}}>🗑</button></div>},
  ];
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Head title="Proveedores de Liquidez" sub={`${suppliers.length} proveedores`} action="Nuevo" onAction={()=>{setEditRow(null);setForm(empty);setModal(true);}}/>
    <Tabla cols={cols} rows={enriched} emptyMsg="Sin proveedores"/>
    {modal&&<Modal title={editRow?"Editar Proveedor":"Nuevo Proveedor"} onClose={()=>{setModal(false);setEditRow(null);setForm(empty);}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <Inp label="Nombre / alias" value={form.name} onChange={f("name")}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><Inp label="Contacto" value={form.contact} onChange={f("contact")}/><Inp label="Teléfono" value={form.phone} onChange={f("phone")}/></div>
        <Inp label="Notas" value={form.notes} onChange={f("notes")}/>
        <Btn onClick={saveSup} full>{editRow?"Actualizar":"Guardar"}</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── FLUJO DE CAJA ────────────────────────────────────────────────────────
function CashFlowModule({cashflow,reload,toast}){
  const[modal,setModal]=useState(false);const[filter,setFilter]=useState("all");
  const[period,setPeriod]=useState("month");const[from,setFrom]=useState("");const[to,setTo]=useState("");
  const empty={date:today(),type:"ingreso",description:"",amount:"",method:"transferencia"};
  const[form,setForm]=useState(empty);const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const balance=cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0);
  const filtered=cashflow.filter(e=>inP(e.date,period,from,to)&&(filter==="all"||e.type===filter));
  const ing=filtered.filter(e=>e.type==="ingreso").reduce((a,e)=>a+e.amount,0);
  const egr=filtered.filter(e=>e.type==="egreso").reduce((a,e)=>a+e.amount,0);
  const save=async()=>{if(!form.amount||+form.amount<=0){toast("Valor inválido","error");return;}try{await api.addCashFlow(form);await reload();setModal(false);setForm(empty);toast("Registrado");}catch(e){toast(e.message,"error");}};
  const cols=[
    {key:"date",label:"Fecha"},{key:"type",label:"Tipo",render:v=><span style={{color:v==="ingreso"?C.green:C.rose,fontWeight:700,fontSize:10,textTransform:"uppercase"}}>{v}</span>},
    {key:"description",label:"Descripción"},{key:"method",label:"Método"},
    {key:"amount",label:"Valor",render:(v,r)=><b style={{color:r.type==="ingreso"?C.green:C.rose}}>{r.type==="ingreso"?"+":"-"}{fmt(v)}</b>},
    {key:"acc",label:"",render:(_,r)=><div style={{display:"flex",gap:4}}><button onClick={e=>{e.stopPropagation();setCFEdit(r);setCFForm({date:r.date,type:r.type,description:r.description||"",amount:String(r.amount),method:r.method||"transferencia"});setCFModal(true);}} style={{fontSize:10,background:C.card2,border:`1px solid ${C.border}`,color:C.text,borderRadius:5,padding:"2px 8px",cursor:"pointer"}}>✏️</button><button onClick={async e=>{e.stopPropagation();try{await api.delCashFlow(r.id);await reload();toast("Eliminado");}catch(er){toast(er.message,"error");}}} style={{fontSize:10,background:"#2D1218",border:`1px solid ${C.rose}`,color:C.rose,borderRadius:5,padding:"2px 8px",cursor:"pointer"}}>🗑</button></div>},
  ];
  const[cfEdit,setCFEdit]=useState(null);const[cfModal,setCFModal]=useState(false);const[cfForm,setCFForm]=useState({date:today(),type:"ingreso",description:"",amount:"",method:"transferencia"});
  const saveCF=async()=>{
    if(!cfForm.amount||+cfForm.amount<=0){toast("Valor inválido","error");return;}
    try{
      if(cfEdit){await api.updateCashFlow(cfEdit.id,cfForm);toast("Movimiento actualizado");}
      else{await api.addCashFlow(cfForm);toast("Registrado");}
      await reload();setCFModal(false);setCFEdit(null);setCFForm({date:today(),type:"ingreso",description:"",amount:"",method:"transferencia"});
    }catch(e){toast(e.message,"error");}
  };
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Head title="Flujo de Caja" action="Movimiento" onAction={()=>{setCFEdit(null);setCFForm({date:today(),type:"ingreso",description:"",amount:"",method:"transferencia"});setCFModal(true);}}
      extra={<Btn small variant="sec" onClick={()=>exportCSV(["Fecha","Tipo","Descripción","Método","Valor"],filtered.map(e=>[e.date,e.type,e.description,e.method,e.amount]),`flujo-caja-${today()}.csv`)}>📥 Excel</Btn>}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
      <Stat small label="Saldo Total" value={fmtK(balance)} accent={balance>=0?C.accentL:C.rose}/>
      <Stat small label="Ingresos" value={fmtK(ing)} accent={C.green}/>
      <Stat small label="Egresos" value={fmtK(egr)} accent={C.rose}/>
      <Stat small label="Neto" value={fmtK(ing-egr)} accent={ing-egr>=0?C.green:C.rose}/>
    </div>
    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {[["all","Todos"],["ingreso","Ingresos"],["egreso","Egresos"]].map(([v,l])=><Pill key={v} label={l} active={filter===v} onClick={()=>setFilter(v)}/>)}
    </div>
    <Tabla cols={cols} rows={filtered} emptyMsg="Sin movimientos"/>

      <div style={{display:"flex",flexDirection:"column",gap:10}}>

// ─── RENTABILIDAD ─────────────────────────────────────────────────────────
function ProfitModule({sales,expenses}){
  const[period,setPeriod]=useState("month");const[from,setFrom]=useState("");const[to,setTo]=useState("");
  const fs=sales.filter(s=>inP(s.date,period,from,to));const fe=expenses.filter(e=>inP(e.date,period,from,to));
  const rev=fs.reduce((a,s)=>a+s.total,0),cogs=fs.reduce((a,s)=>a+(+s.cogs||0),0);
  const gross=fs.reduce((a,s)=>a+(+s.gross_profit||0),0),exp=fe.reduce((a,e)=>a+e.amount,0);
  const net=gross-exp,margin=rev>0?((net/rev)*100).toFixed(2):0;
  const dayMap={};fs.forEach(s=>dayMap[s.date]=(dayMap[s.date]||0)+(+s.gross_profit||0));
  const days=Object.keys(dayMap).sort().slice(-31);
  const bySym=COINS.map(sym=>({sym,rev:fs.filter(s=>s.symbol===sym).reduce((a,s)=>a+s.total,0),profit:fs.filter(s=>s.symbol===sym).reduce((a,s)=>a+(+s.gross_profit||0),0),ops:fs.filter(s=>s.symbol===sym).length})).filter(r=>r.ops>0).sort((a,b)=>b.profit-a.profit);
  const byCli={};fs.forEach(s=>{const k=norm(s.client)||"(anón)";if(!byCli[k])byCli[k]={name:s.client||"(anón)",profit:0,ops:0};byCli[k].profit+=(+s.gross_profit||0);byCli[k].ops++;});
  const topCli=Object.values(byCli).sort((a,b)=>b.profit-a.profit).slice(0,8);
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Head title="Rentabilidad" sub="utilidad real · costo promedio ponderado"
      extra={<Btn small variant="sec" onClick={()=>exportCSV(["Fecha","Moneda","Cantidad","P.Venta","CPP","Ingreso","Costo","Utilidad","Cliente"],fs.map(s=>[s.date,s.symbol,s.quantity,s.unit_price,s.avg_cost_used,s.total,s.cogs,s.gross_profit,s.client||""]),`rentabilidad-${today()}.csv`)}>📥 Excel</Btn>}/>
    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
      <Stat small label="Ingresos" value={fmtK(rev)} accent={C.blue}/>
      <Stat small label="Costo Vendido" value={fmtK(cogs)} accent={C.rose}/>
      <Stat small label="Utilidad Bruta" value={fmtK(gross)} accent={C.amber}/>
      <Stat small label="Gastos" value={fmtK(exp)} accent={C.rose}/>
      <Stat small label="Utilidad Neta" value={fmtK(net)} accent={net>=0?C.green:C.rose}/>
      <Stat small label="Margen Neto" value={`${margin}%`} accent={+margin>1.5?C.green:+margin>0.5?C.amber:C.rose}/>
    </div>
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16}}>
      <h4 style={{margin:"0 0 12px",fontSize:13,fontWeight:700}}>Estado de Resultados</h4>
      {[{l:"(+) Ingresos",v:rev,c:C.text},{l:"(−) Costo vendido",v:cogs,c:C.rose},{l:"= Utilidad Bruta",v:gross,c:C.amber,b:1},{l:"(−) Gastos",v:exp,c:C.rose},{l:"= Utilidad Neta",v:net,c:net>=0?C.green:C.rose,b:1,big:1}].map((r,i,arr)=><div key={r.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none"}}><span style={{fontSize:r.big?14:12,fontWeight:r.b?700:400}}>{r.l}</span><span style={{fontSize:r.big?18:13,fontWeight:r.b?700:500,color:r.c,fontFamily:"monospace"}}>{fmt(r.v)}</span></div>)}
    </div>
    {days.length>1&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:14}}><h4 style={{margin:"0 0 10px",fontSize:12,fontWeight:600}}>Utilidad por Día</h4><Bars data={days.map(d=>Math.max(0,dayMap[d]))} labels={days.map(d=>d.slice(8))} color={C.green} h={80}/></div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:12}}>
      {bySym.length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:14}}><h4 style={{margin:"0 0 12px",fontSize:12,fontWeight:600}}>Por Moneda</h4>{bySym.map(r=><div key={r.sym} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`,fontSize:12}}><span><span style={{display:"inline-block",width:7,height:7,borderRadius:"50%",background:COIN_C[r.sym],marginRight:7}}/>{r.sym} <span style={{color:C.muted,fontSize:10}}>({r.ops})</span></span><b style={{color:r.profit>=0?C.green:C.rose}}>{fmt(r.profit)}</b></div>)}</div>}
      {topCli.length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:14}}><h4 style={{margin:"0 0 12px",fontSize:12,fontWeight:600}}>Por Cliente</h4>{topCli.map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`,fontSize:12}}><span>{r.name} <span style={{color:C.muted,fontSize:10}}>({r.ops})</span></span><b style={{color:r.profit>=0?C.green:C.rose}}>{fmt(r.profit)}</b></div>)}</div>}
    </div>
  </div>;
}

// ─── METAS ────────────────────────────────────────────────────────────────
function GoalsModule({goals,sales,purchases,clients,cashflow,inventory,reload,toast}){
  const[scope,setScope]=useState("month");const[modal,setModal]=useState(false);
  const key=scope==="month"?mKey():yKey();const g=goals.find(x=>x.month===key)||{};
  const[form,setForm]=useState({});const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const fs=sales.filter(s=>scope==="month"?s.date.slice(0,7)===key:s.date.slice(0,4)===key);
  const fp=purchases.filter(p=>scope==="month"?p.date.slice(0,7)===key:p.date.slice(0,4)===key);
  const profit=fs.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const vol=fs.reduce((a,s)=>a+s.total,0)+fp.reduce((a,p)=>a+p.total,0);
  const newCli=clients.filter(c=>c.created_at&&(scope==="month"?c.created_at.slice(0,7)===key:c.created_at.slice(0,4)===key)).length;
  const activos=new Set();[...fs,...fp].forEach(o=>{const n=o.client||o.supplier;if(n)activos.add(norm(n));});
  const capital=cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0);
  const invested=inventory.reduce((a,i)=>a+(+i.total_invested||0),0);
  const now=new Date(),dayN=scope==="month"?now.getDate():Math.ceil((now-new Date(now.getFullYear(),0,1))/86400000);
  const dayT=scope==="month"?new Date(now.getFullYear(),now.getMonth()+1,0).getDate():365;
  const proj=v=>dayN>0?Math.round(v/dayN*dayT):0;
  const eta=(cur,target)=>{if(target<=0)return"—";if(cur>=target)return"✓ Cumplida";const rate=cur/dayN;if(rate<=0)return"sin ritmo";const need=Math.ceil((target-cur)/rate);const d=new Date();d.setDate(d.getDate()+need);const limit=scope==="month"?new Date(now.getFullYear(),now.getMonth()+1,0):new Date(now.getFullYear(),11,31);return d<=limit?d.toLocaleDateString("es-CO",{day:"numeric",month:"short"}):"fuera del período";};
  const metrics=[
    {key:"profit_goal",label:"Utilidad",cur:profit,color:C.green,f:fmtK,proj:1},
    {key:"sales_goal",label:"Volumen",cur:vol,color:C.blue,f:fmtK,proj:1},
    {key:"clients_goal",label:"Clientes Nuevos",cur:newCli,color:C.purple,f:v=>v,proj:1},
    {key:"active_clients_goal",label:"Clientes Activos",cur:activos.size,color:C.amber,f:v=>v,proj:0},
    {key:"capital_goal",label:"Capital (caja)",cur:capital,color:C.accentL,f:fmtK,proj:0},
    {key:"inventory_goal",label:"Inventario COP",cur:invested,color:COIN_C.USDT,f:fmtK,proj:0},
  ];
  const openEdit=()=>{const init={};metrics.forEach(m=>init[m.key]=g[m.key]||"");setForm(init);setModal(true);};
  const save=async()=>{try{const payload={};metrics.forEach(m=>payload[m.key]=+form[m.key]||0);await api.saveGoal(key,payload);await reload();setModal(false);toast("Metas guardadas");}catch(e){toast(e.message,"error");}};
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Head title="Metas y Objetivos" sub={scope==="month"?`Mes: ${key}`:`Año: ${key}`} action="Editar Metas" onAction={openEdit}/>
    <div style={{display:"flex",gap:5}}><Pill label="📅 Mensuales" active={scope==="month"} onClick={()=>setScope("month")}/><Pill label="🗓 Anuales" active={scope==="year"} onClick={()=>setScope("year")}/></div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {metrics.map(m=>{const target=+g[m.key]||0;const pct=target>0?Math.min(100,Math.round((m.cur/target)*100)):0;return <div key={m.key} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:14}}>
        <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4,marginBottom:6}}>
          <b style={{fontSize:13}}>{m.label}</b>
          <div style={{display:"flex",gap:12,fontSize:11,color:C.muted,flexWrap:"wrap"}}>
            <span>Actual: <b style={{color:m.color}}>{m.f(m.cur)}</b></span>
            <span>Meta: <b style={{color:C.text}}>{target>0?m.f(target):"sin definir"}</b></span>
            {target>0&&<span>Avance: <b style={{color:pct>=100?C.green:m.color}}>{pct}%</b></span>}
            {target>0&&m.proj===1&&<React.Fragment><span>Proyecc.: <b style={{color:proj(m.cur)>=target?C.green:C.amber}}>{m.f(proj(m.cur))}</b></span><span>ETA: <b style={{color:C.text}}>{eta(m.cur,target)}</b></span></React.Fragment>}
          </div>
        </div>
        <div style={{height:6,background:C.border,borderRadius:3}}><div style={{height:"100%",background:pct>=100?C.green:m.color,borderRadius:3,width:`${pct}%`,transition:"width .5s"}}/></div>
      </div>;})}
    </div>
    {modal&&<Modal title={`Metas ${scope==="month"?"del Mes":"del Año"}`} onClose={()=>setModal(false)}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {metrics.map(m=><Inp key={m.key} label={`Meta ${m.label}`} type="number" value={form[m.key]||""} onChange={f(m.key)}/>)}
        <Btn onClick={save} full>Guardar Metas</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── CIERRES ──────────────────────────────────────────────────────────────
function ClosingsModule({closings,sales,purchases,expenses,cashflow,inventory,reload,toast}){
  const[saving,setSaving]=useState(false);const[detail,setDetail]=useState(null);
  const gen=async(type)=>{
    const t=today();let start=t;
    if(type==="semanal"){const d=new Date();d.setDate(d.getDate()-6);start=d.toISOString().split("T")[0];}
    if(type==="mensual")start=mKey()+"-01";
    const fs=sales.filter(s=>s.date>=start&&s.date<=t),fp=purchases.filter(p=>p.date>=start&&p.date<=t),fe=expenses.filter(e=>e.date>=start&&e.date<=t);
    const gross=fs.reduce((a,s)=>a+(+s.gross_profit||0),0),exp=fe.reduce((a,e)=>a+e.amount,0);
    setSaving(true);
    try{await api.addClosing({type,period_start:start,period_end:t,purchases_total:fp.reduce((a,p)=>a+p.total,0),sales_total:fs.reduce((a,s)=>a+s.total,0),gross_profit:gross,expenses_total:exp,net_profit:gross-exp,cash_balance:cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0),inventory_value:inventory.reduce((a,i)=>a+(+i.total_invested||0),0),inventory_snapshot:inventory.map(i=>({symbol:i.symbol,qty:+i.quantity,avg:+i.avg_cost,inv:+i.total_invested})),notes:`${fs.length} ventas · ${fp.length} compras`});await reload();toast(`Cierre ${type} generado`);}
    catch(e){toast(e.message,"error");}finally{setSaving(false);}
  };
  const cols=[
    {key:"created_at",label:"Generado",render:v=>v&&v.slice(0,16).replace("T"," ")},
    {key:"type",label:"Tipo",render:v=><Badge label={v} color={v==="diario"?C.blue:v==="semanal"?C.amber:C.purple}/>},
    {key:"per",label:"Período",render:(_,r)=><span style={{fontSize:11}}>{r.period_start} → {r.period_end}</span>},
    {key:"sales_total",label:"Ventas",render:v=><span style={{color:C.blue}}>{fmtK(v)}</span>},
    {key:"net_profit",label:"Utilidad Neta",render:v=><b style={{color:v>=0?C.green:C.rose}}>{fmtK(v)}</b>},
    {key:"cash_balance",label:"Caja",render:v=>fmtK(v)},{key:"inventory_value",label:"Inventario",render:v=>fmtK(v)},
  ];
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Head title="Cierres Contables" extra={<Btn small variant="sec" onClick={()=>exportCSV(["Generado","Tipo","Inicio","Fin","Ventas","Compras","Ut.Bruta","Gastos","Ut.Neta","Caja","Inventario"],closings.map(c=>[c.created_at?.slice(0,16),c.type,c.period_start,c.period_end,c.sales_total,c.purchases_total,c.gross_profit,c.expenses_total,c.net_profit,c.cash_balance,c.inventory_value]),`cierres-${today()}.csv`)}>📥 Excel</Btn>}/>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <Btn onClick={()=>gen("diario")} disabled={saving} icon="☀️">Cierre Diario</Btn>
      <Btn variant="sec" onClick={()=>gen("semanal")} disabled={saving} icon="📅">Cierre Semanal</Btn>
      <Btn variant="sec" onClick={()=>gen("mensual")} disabled={saving} icon="🗓">Cierre Mensual</Btn>
    </div>
    <Tabla cols={cols} rows={closings} onRowClick={setDetail} emptyMsg="Sin cierres — genera el primero"/>
    {detail&&<Modal title={`Cierre ${detail.type} · ${detail.period_end}`} onClose={()=>setDetail(null)}>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {[["Período",`${detail.period_start} → ${detail.period_end}`],["Ventas",fmt(detail.sales_total)],["Compras",fmt(detail.purchases_total)],["Utilidad Bruta",fmt(detail.gross_profit)],["Gastos",fmt(detail.expenses_total)],["Utilidad Neta",fmt(detail.net_profit)],["Caja",fmt(detail.cash_balance)],["Inventario",fmt(detail.inventory_value)]].map(([l,v])=><div key={l} style={{display:"flex",justifyContent:"space-between",borderBottom:`1px solid ${C.border}`,padding:"6px 0",fontSize:12}}><span style={{color:C.muted}}>{l}</span><b>{v}</b></div>)}
        {detail.inventory_snapshot&&<div><h4 style={{margin:"8px 0",fontSize:12}}>Inventario al cierre</h4>{(detail.inventory_snapshot||[]).filter(i=>i.qty>0).map(i=><div key={i.symbol} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"3px 0",color:C.muted}}><span style={{color:COIN_C[i.symbol]||C.text,fontFamily:"monospace"}}>{i.symbol}</span><span>{fmtQ(i.qty,i.symbol)} · CPP {fmt(i.avg)} · {fmt(i.inv)}</span></div>)}</div>}
      </div>
    </Modal>}
  </div>;
}

  useEffect(()=>{
    api.session().then(async u=>{if(u){setUser(u);setLoading(true);try{await reload();}catch(e){}setLoading(false);}}).finally(()=>setChecking(false));
  },[]);

  const handleLogin=async u=>{setUser(u);setLoading(true);try{await reload();}catch(e){toast("Error cargando","error");}setLoading(false);};

  const W=typeof window!=="undefined"?window.innerWidth:1024;
  const isMob=W<768;const SW=222;

  if(checking)return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:13}}>Iniciando...</div>;
  if(!user)return <Login onLogin={handleLogin}/>;

  const nav=NAV.find(n=>n.id===active)||NAV[0];
  const props={clients,suppliers,inventory,purchases,sales,kardex,payments,cashflow,expenses,goals,closings,reload,toast,setActive};

  const Module=()=>{
    if(loading)return <div style={{padding:60,textAlign:"center",color:C.muted,fontSize:13}}>Cargando datos...</div>;
    switch(active){
      case "dash":     return <Dashboard {...props}/>;
      case "buy":      return <PurchasesModule {...props}/>;
      case "sell":     return <SalesModule {...props}/>;
      case "inv":      return <InventoryModule {...props}/>;
      case "clients":  return <ClientsModule {...props}/>;
      case "cartera":  return <CarteraModule {...props}/>;
      case "suppliers":return <SuppliersModule {...props}/>;
      case "treasury": return <TreasuryModule {...props}/>;
      case "cash":     return <CashFlowModule {...props}/>;
      case "exp":      return <ExpensesModule {...props}/>;
      case "profit":   return <ProfitModule {...props}/>;
      case "goals":    return <GoalsModule {...props}/>;
      case "closings": return <ClosingsModule {...props}/>;
      default:return null;
    }
  };

  return <div style={{minHeight:"100vh",background:C.bg,display:"flex"}}>
    {sidebar&&<div onClick={()=>setSidebar(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:40}}/>}

    <nav style={{width:SW,background:C.panel,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",position:"fixed",top:0,bottom:0,left:0,zIndex:50,transform:isMob?`translateX(${sidebar?0:-SW}px)`:"none",transition:"transform .22s"}}>
      <div style={{padding:"16px 13px 11px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <span style={{fontSize:24,filter:"drop-shadow(0 0 8px rgba(38,161,123,.5))"}}>₿</span>
          <div>
            <div style={{fontSize:12,fontWeight:800,background:"linear-gradient(135deg,#26A17B,#2DC48A)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Casa de Cambio <span style={{fontSize:8,background:"none",WebkitTextFillColor:C.accentL}}>PRO 3.0</span></div>
            <div style={{fontSize:10,color:C.muted}}>{user.name||user.email}</div>
          </div>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"5px 7px"}}>
        {GROUPS.map(g=><div key={g} style={{marginBottom:4}}>
          <div style={{fontSize:8,color:C.dim,textTransform:"uppercase",letterSpacing:1.2,padding:"5px 11px 2px",fontWeight:700}}>{g}</div>
          {NAV.filter(n=>n.g===g).map(n=><button key={n.id} onClick={()=>{setActive(n.id);setSidebar(false);}} style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"7px 11px",background:active===n.id?`${C.accent}18`:"transparent",border:`1px solid ${active===n.id?C.accent+"50":"transparent"}`,borderRadius:7,cursor:"pointer",textAlign:"left",marginBottom:1,color:active===n.id?C.accentL:C.muted,fontSize:12,fontWeight:active===n.id?600:400,transition:"all .12s"}}>
            <span style={{fontSize:13}}>{n.icon}</span>{n.label}
          </button>)}
        </div>)}
      </div>
      <div style={{padding:"9px 13px",borderTop:`1px solid ${C.border}`}}>
        <div style={{fontSize:10,color:C.muted,marginBottom:6}}>👤 {user.role==="admin"?"Administrador":"Empleado"}</div>
        <button onClick={async()=>{await api.logout();setUser(null);}} style={{width:"100%",padding:"6px",background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:7,cursor:"pointer",fontSize:11,textAlign:"center"}}>Cerrar sesión</button>
      </div>
    </nav>

    <div style={{marginLeft:isMob?0:SW,flex:1,display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      <header style={{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"0 14px",height:46,display:"flex",alignItems:"center",gap:9,position:"sticky",top:0,zIndex:30}}>
        {isMob&&<button onClick={()=>setSidebar(s=>!s)} style={{background:"none",border:"none",color:C.muted,fontSize:18,cursor:"pointer",padding:3}}>☰</button>}
        <span style={{fontSize:14}}>{nav.icon}</span>
        <h2 style={{margin:0,fontSize:14,fontWeight:700,flex:1}}>{nav.label}</h2>
        <button onClick={async()=>{setLoading(true);try{await reload();toast("Actualizado");}catch(e){toast(e.message,"error");}setLoading(false);}} style={{background:"none",border:`1px solid ${C.border}`,color:C.muted,borderRadius:7,padding:"4px 9px",cursor:"pointer",fontSize:11}} title="Actualizar datos">🔄</button>
        <div style={{fontSize:10,color:C.muted}}>{new Date().toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"})}</div>
      </header>
      <main style={{flex:1,padding:"14px 12px 40px",maxWidth:1400,width:"100%",margin:"0 auto"}}>
        <Module/>
      </main>
    </div>

    {toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onDone={()=>remove(t.id)}/>)}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
