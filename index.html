<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test React</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="background:#0a0e14;color:#fff;font-family:sans-serif;margin:0;">
<div id="root"></div>
<script type="text/babel">
function App(){
  const[count,setCount]=React.useState(0);
  return <div style={{padding:40,textAlign:"center"}}>
    <h1 style={{color:"#26A17B"}}>✓ React + Babel funcionan</h1>
    <p>Contador: {count}</p>
    <button onClick={()=>setCount(count+1)} style={{padding:"8px 20px",background:"#26A17B",color:"#fff",border:"none",borderRadius:8}}>+1</button>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
