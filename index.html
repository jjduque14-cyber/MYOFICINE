function inPeriod(d, p, from, to){
  if(!d) return false;
  if(p==="all") return true;
  if(p==="today") return d===today();
  if(p==="week"){ const x=new Date(d+"T12:00"); const lim=new Date(); lim.setDate(lim.getDate()-7); return x>=lim; }
  if(p==="month") return d.slice(0,7)===monthKey();
  if(p==="year") return d.slice(0,4)===yearKey();
  if(p==="custom") return (!from||d>=from)&&(!to||d<=to);
  return true;
}

function exportCSV(headers, rows, filename){
  const all=[headers,...rows];
  const csv=all.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

  if(r.due_date && r.due_date<today()) return "vencido";
  return (+r.paid||0)>0 ? "parcial" : "pendiente";
}

// ─── Cuenta corriente / Libro mayor ───────────────────────────────────────
function buildLedger(name, sales, purchases, payments){
  const n=norm(name);
  const rows=[];
  sales.filter(s=>norm(s.client)===n).forEach(s=>rows.push({
    id:"v"+s.id,date:s.date,ts:s.created_at||"",concept:`Venta ${fmtQ(s.quantity,s.symbol)} ${s.symbol} @ ${fmt(s.unit_price)}`,
    debit:+s.total,credit:0,kind:"venta"
  }));
  purchases.filter(p=>norm(p.supplier)===n).forEach(p=>rows.push({
    id:"c"+p.id,date:p.date,ts:p.created_at||"",concept:`Compra ${fmtQ(p.quantity,p.symbol)} ${p.symbol} @ ${fmt(p.unit_cost)}`,
    debit:0,credit:+p.total,kind:"compra"
  }));
  payments.filter(p=>norm(p.party)===n).forEach(p=>rows.push({
    id:"p"+p.id,date:p.date,ts:p.created_at||"",
    concept:(p.direction==="recibido"?"Pago recibido":"Pago realizado")+(p.notes?` · ${p.notes}`:""),
    debit:p.direction==="realizado"?+p.amount:0,credit:p.direction==="recibido"?+p.amount:0,
    kind:"pago",receipt:p.receipt_url
  }));
  rows.sort((a,b)=>a.date===b.date?String(a.ts).localeCompare(String(b.ts)):a.date.localeCompare(b.date));
  let saldo=0;
  rows.forEach(r=>{saldo+=r.debit-r.credit;r.saldo=saldo;});
  return rows;
}

function clientStats(client, sales, purchases, payments){
  const n=norm(client.name);
  const vs=sales.filter(s=>norm(s.client)===n);
  const cs=purchases.filter(p=>norm(p.supplier)===n);
  const ps=payments.filter(p=>norm(p.party)===n);
  const ledger=buildLedger(client.name,sales,purchases,payments);
  const saldo=ledger.length?ledger[ledger.length-1].saldo:0;
  const totalVendido=vs.reduce((a,s)=>a+s.total,0);
  const totalComprado=cs.reduce((a,p)=>a+p.total,0);
  const volCOP=totalVendido+totalComprado;
  const volBySym={};[...vs,...cs].forEach(o=>volBySym[o.symbol]=(volBySym[o.symbol]||0)+ +o.quantity);
  const profit=vs.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const ops=vs.length+cs.length;
  const dates=[...vs,...cs].map(o=>o.date).sort();
  const first=dates[0]||null, last=dates[dates.length-1]||null;
  const since=client.created_at?client.created_at.slice(0,10):first;
  const monthsActive=first?Math.max(1,Math.round(daysBetween(first,today())/30)):1;
  return {
    vs,cs,ps,ledger,saldo,totalVendido,totalComprado,volCOP,volBySym,profit,ops,first,last,since,
    ticket:ops>0?volCOP/ops:0,
    freqVenta:(vs.length/monthsActive).toFixed(1),
    freqCompra:(cs.length/monthsActive).toFixed(1),
    totalCobrado:ps.filter(p=>p.direction==="recibido").reduce((a,p)=>a+ +p.amount,0),
    totalPagado:ps.filter(p=>p.direction==="realizado").reduce((a,p)=>a+ +p.amount,0),
    porCobrar:vs.reduce((a,s)=>a+pendOf(s),0),
    porPagar:cs.reduce((a,p)=>a+pendOf(p),0),
  };
}

function Spark({data,color=C.accent,h=36,w=86}){
  if(!data||data.length<2)return null;
  const min=Math.min(...data),max=Math.max(...data),r=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/r)*(h-6)-3}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{flexShrink:0}}>
    <polyline fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" points={pts}/>
    <circle cx={last[0]} cy={last[1]} r="3" fill={color}/>
  </svg>;
}

function Bars({data,labels,color=C.accent,h=90}){
  const max=Math.max(...data,1);
  return <div style={{display:"flex",alignItems:"flex-end",gap:4,height:h}}>
    {data.map((v,i)=>(
      <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
        <div style={{width:"100%",background:color,borderRadius:"3px 3px 0 0",height:`${Math.max(2,(v/max)*(h-18))}px`}}/>
        <span style={{fontSize:8,color:C.muted}}>{labels[i]}</span>
      </div>
    ))}
  </div>;
}

function useToast(){
  const[toasts,setToasts]=useState([]);

}

function PaymentModal({ctx,onClose,reload,toast}){
  const[form,setForm]=useState({date:today(),amount:ctx.maxAmount?String(ctx.maxAmount):"",method:"transferencia",notes:""});
  const[file,setFile]=useState(null);
  const[saving,setSaving]=useState(false);
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const save=async()=>{
    if(!form.amount||+form.amount<=0){toast("Ingresa un valor válido","error");return;}
    setSaving(true);
    try{
      await api.addPayment({...form,party:ctx.party,direction:ctx.direction,reference_type:ctx.reference_type,reference_id:ctx.reference_id},file);
      await reload();onClose();
      toast(`${ctx.direction==="recibido"?"Pago recibido":"Pago realizado"} registrado`);
    }catch(e){toast(e.message,"error");}
    finally{setSaving(false);}
  };
  return <Modal title={ctx.title||"Registrar Pago"} onClose={onClose}>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{background:C.panel,borderRadius:8,padding:10,fontSize:12,color:C.muted}}>
        {ctx.direction==="recibido"?"💰 Pago que RECIBES de":"💸 Pago que REALIZAS a"} <b style={{color:C.text}}>{ctx.party}</b>
        {ctx.maxAmount>0&&<span> · Pendiente: <b style={{color:C.amber}}>{fmt(ctx.maxAmount)}</b></span>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Fecha" type="date" value={form.date} onChange={f("date")}/>
        <Inp label="Valor" type="number" value={form.amount} onChange={f("amount")}/>
      </div>
      <Sel label="Método" value={form.method} onChange={f("method")} options={METHODS.map(m=>({value:m,label:m.charAt(0).toUpperCase()+m.slice(1)}))}/>
      <Inp label="Notas" value={form.notes} onChange={f("notes")} placeholder="Ej: Abono parcial"/>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        <label style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:"uppercase"}}>📎 Comprobante (foto o PDF)</label>
        <input type="file" accept="image/*,.pdf" onChange={e=>setFile(e.target.files&&e.target.files[0]||null)}/>

function Dashboard({inventory,sales,purchases,cashflow,clients,goals,setActive}){
  const[rank,setRank]=useState("profit");

  const capital=cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0);
  const usdtInv=inventory.find(i=>i.symbol==="USDT");
  const totalInvested=inventory.reduce((a,i)=>a+(+i.total_invested||0),0);

  const inP=(arr,p)=>arr.filter(x=>inPeriod(x.date,p));
  const profit=arr=>arr.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const tot=arr=>arr.reduce((a,s)=>a+(+s.total||0),0);

  const dS=inP(sales,"today"),wS=inP(sales,"week"),mS=inP(sales,"month"),yS=inP(sales,"year");
  const dP=inP(purchases,"today"),mP=inP(purchases,"month");

  const porCobrar=sales.reduce((a,s)=>a+pendOf(s),0);
  const porPagar=purchases.reduce((a,p)=>a+pendOf(p),0);
  const vencidos=sales.filter(s=>statusOf(s)==="vencido");

  const activos=new Set();
  [...sales,...purchases].forEach(o=>{
    const name=o.client||o.supplier;
    if(name&&daysBetween(o.date,today())<=30)activos.add(norm(name));
  });

  const mPU=mP.filter(p=>p.symbol==="USDT"),mSU=mS.filter(s=>s.symbol==="USDT");
  const buyQty=mPU.reduce((a,p)=>a+ +p.quantity,0),sellQty=mSU.reduce((a,s)=>a+ +s.quantity,0);
  const avgBuy=buyQty>0?tot(mPU)/buyQty:0;
  const avgSell=sellQty>0?tot(mSU)/sellQty:0;
  const spread=avgBuy>0&&avgSell>0?avgSell-avgBuy:0;

  const last14=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(13-i));return d.toISOString().split("T")[0];});
  const profitSeries=last14.map(d=>profit(sales.filter(s=>s.date===d)));
  const volSeries=last14.map(d=>tot(sales.filter(s=>s.date===d))/1000);
  const dayLabels=last14.map(d=>d.slice(8));

  const byClient={};
  sales.forEach(s=>{const k=norm(s.client)||"(sin nombre)";if(!byClient[k])byClient[k]={name:s.client||"(sin nombre)",profit:0,vol:0,ops:0,buys:0,sells:0};byClient[k].profit+=(+s.gross_profit||0);byClient[k].vol+=s.total;byClient[k].ops++;byClient[k].sells+=s.total;});
  purchases.forEach(p=>{const k=norm(p.supplier)||"(sin nombre)";if(!byClient[k])byClient[k]={name:p.supplier||"(sin nombre)",profit:0,vol:0,ops:0,buys:0,sells:0};byClient[k].vol+=p.total;byClient[k].ops++;byClient[k].buys+=p.total;});
  const rankKey={profit:"profit",vol:"vol",ops:"ops",buys:"buys",sells:"sells"}[rank];
  const top5=Object.values(byClient).sort((a,b)=>b[rankKey]-a[rankKey]).slice(0,5);
  const rankFmt=v=>rank==="ops"?v:fmtK(v);

  const avgTicket=sales.length>0?tot(sales)/sales.length:0;
  const bigOps=[...sales,...purchases].filter(o=>daysBetween(o.date,today())<=7&&o.total>=Math.max(50e6,avgTicket*4));
  const mGoal=goals.find(g=>g.month===monthKey());
  const alerts=[];
  if(vencidos.length>0)alerts.push({c:C.rose,icon:"🔴",msg:`${vencidos.length} cuenta(s) VENCIDA(S) por ${fmt(vencidos.reduce((a,s)=>a+pendOf(s),0))}`,go:"cartera"});
  if(porCobrar>0&&vencidos.length===0)alerts.push({c:C.amber,icon:"🟡",msg:`Cartera por cobrar: ${fmt(porCobrar)}`,go:"cartera"});
  if(porPagar>0)alerts.push({c:C.blue,icon:"🔵",msg:`Por pagar a proveedores: ${fmt(porPagar)}`,go:"cartera"});
  if(usdtInv&&+usdtInv.quantity<=0)alerts.push({c:C.rose,icon:"⚠️",msg:"Sin inventario USDT disponible",go:"buy"});
  else if(mGoal&&+mGoal.inventory_goal>0&&totalInvested<+mGoal.inventory_goal*0.3)alerts.push({c:C.amber,icon:"📉",msg:`Inventario bajo: ${fmtK(totalInvested)} (menos del 30% del objetivo)`,go:"inv"});
  if(bigOps.length>0)alerts.push({c:C.purple,icon:"💎",msg:`${bigOps.length} operación(es) grande(s) esta semana`,go:"sell"});
  if(mGoal&&+mGoal.profit_goal>0){
    const pct=profit(mS)/+mGoal.profit_goal*100;
    const dayPct=new Date().getDate()/new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()*100;
    if(pct>=90&&pct<100)alerts.push({c:C.green,icon:"🎯",msg:`Meta de utilidad al ${Math.round(pct)}% · ¡casi!`,go:"goals"});
    else if(pct<dayPct-25)alerts.push({c:C.amber,icon:"⏳",msg:`Meta de utilidad atrasada (${Math.round(pct)}% vs ${Math.round(dayPct)}% esperado)`,go:"goals"});
  }

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    {alerts.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
      {alerts.map((a,i)=><button key={i} onClick={()=>setActive(a.go)} style={{display:"flex",alignItems:"center",gap:10,background:`${a.c}14`,border:`1px solid ${a.c}`,borderRadius:10,padding:"10px 14px",color:C.text,fontSize:13,cursor:"pointer",textAlign:"left"}}>
        <span>{a.icon}</span><span style={{flex:1}}>{a.msg}</span><span style={{color:a.c,fontSize:11}}>Ver →</span>
      </button>)}
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
      <Stat label="Capital Disponible" value={fmtK(capital)} accent={capital>=0?C.accentL:C.rose} sub="caja actual"/>
      <Stat label="Inventario USDT" value={fmtQ(usdtInv?usdtInv.quantity:0,"USDT")} accent={COIN_C.USDT} sub={usdtInv?`CPP ${fmt(usdtInv.avg_cost)}`:"sin posición"}/>
      <Stat label="Valor Inventario" value={fmtK(totalInvested)} accent={C.amber} sub="costo COP"/>
      <Stat label="Por Cobrar" value={fmtK(porCobrar)} accent={porCobrar>0?C.amber:C.muted} sub={`${sales.filter(s=>pendOf(s)>0.01).length} cuentas`}/>
      <Stat label="Por Pagar" value={fmtK(porPagar)} accent={porPagar>0?C.rose:C.muted} sub={`${purchases.filter(p=>pendOf(p)>0.01).length} cuentas`}/>
      <Stat label="Clientes Activos" value={activos.size} sub="últimos 30 días"/>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Utilidad Hoy" value={fmtK(profit(dS))} accent={profit(dS)>=0?C.green:C.rose} sub={`${dS.length} ventas · ${dP.length} compras`}/>
      <Stat label="Utilidad Semana" value={fmtK(profit(wS))} accent={C.green}/>
      <Stat label="Utilidad Mes" value={fmtK(profit(mS))} accent={C.green} spark={profitSeries} sparkColor={C.green}/>
      <Stat label="Utilidad Año" value={fmtK(profit(yS))} accent={C.accentL}/>
      <Stat label="Volumen Hoy" value={fmtK(tot(dS)+tot(dP))} accent={C.blue} sub={`${dS.length+dP.length} ops`}/>

    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
      <Stat small label="Precio Prom. Compra USDT" value={avgBuy>0?fmt(avgBuy):"—"} sub="este mes"/>

      <Stat small label="Spread Promedio" value={spread>0?fmt(spread):"—"} accent={C.accentL} sub={avgBuy>0&&spread>0?`${((spread/avgBuy)*100).toFixed(2)}%`:""}/>
      <Stat small label="Utilidad Acumulada" value={fmtK(profit(sales))} accent={C.green} sub="histórica"/>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(290px,1fr))",gap:14}}>

      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>

        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
          {[["profit","Utilidad"],["vol","Volumen"],["ops","Operaciones"],["buys","Compras"],["sells","Ventas"]].map(([v,l])=>

    <Head title="Compras de Criptomonedas" sub={`${purchases.length} operaciones`} action="Nueva Compra" onAction={()=>setModal(true)}/>
    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Invertido (período)" value={fmtK(totalCOP)} accent={C.amber}/>
      <Stat label="Operaciones" value={filtered.length}/>
      <Stat label="Pendiente por Pagar" value={fmtK(filtered.reduce((a,p)=>a+pendOf(p),0))} accent={C.rose}/>
    </div>
    <div style={{display:"flex",justifyContent:"flex-end"}}>
      <Btn small variant="secondary" onClick={()=>exportCSV(
        ["Fecha","Moneda","Cantidad","Precio","Total","Pagado","Pendiente","Estado","Vence","Proveedor","Método","Notas"],
        filtered.map(p=>[p.date,p.symbol,p.quantity,p.unit_cost,p.total,p.paid||0,pendOf(p),statusOf(p),p.due_date||"",p.supplier||"",p.pay_method||"",p.notes||""]),

    </div>
    <Tabla cols={cols} rows={filtered} emptyMsg="Sin compras en este período"/>

    {modal&&<Modal title="Nueva Compra" onClose={()=>{setModal(false);setForm(empty);setFile(null);}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Fecha" type="date" value={form.date} onChange={f("date")}/>
          <Sel label="Moneda" value={form.symbol} onChange={f("symbol")} options={COINS.map(c=>({value:c,label:c}))}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Cantidad" type="number" value={form.quantity} onChange={f("quantity")} placeholder="Ej: 30000"/>
          <Inp label="Precio unit. COP" type="number" value={form.unit_cost} onChange={f("unit_cost")} placeholder="Ej: 3500"/>
        </div>
        {form.quantity&&form.unit_cost&&<div style={{background:C.panel,borderRadius:8,padding:12,display:"flex",gap:14,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:C.muted}}>Total: <b style={{color:C.amber}}>{fmt(+form.quantity*+form.unit_cost)}</b></span>
          {curInv&&+curInv.quantity>0&&<span style={{fontSize:13,color:C.muted}}>CPP nuevo: <b>{fmt((+curInv.quantity*+curInv.avg_cost + +form.quantity*+form.unit_cost)/(+curInv.quantity + +form.quantity))}</b></span>}
        </div>}
        <Inp label="Proveedor" value={form.supplier} onChange={f("supplier")} list="sup-dl" placeholder="Nombre o alias"/>
        <datalist id="sup-dl">{suppliers.map(s=><option key={s.id} value={s.name}/>)}</datalist>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Sel label="Forma de pago" value={form.payType} onChange={f("payType")} options={[{value:"contado",label:"💵 Contado"},{value:"credito",label:"📅 Crédito"}]}/>
          <Sel label="Método" value={form.pay_method} onChange={f("pay_method")} options={METHODS.map(m=>({value:m,label:m.charAt(0).toUpperCase()+m.slice(1)}))}/>
        </div>

        <Inp label="Notas" value={form.notes} onChange={f("notes")}/>

          <label style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:"uppercase"}}>📎 Comprobante (opcional)</label>

        </div>
        <Btn onClick={save} disabled={saving} full>{saving?"Procesando...":"Registrar Compra"}</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── VENTAS ───────────────────────────────────────────────────────────────
function SalesModule({sales,inventory,clients,reload,toast}){
  const[modal,setModal]=useState(false);
  const[saving,setSaving]=useState(false);
  const[period,setPeriod]=useState("month");
  const[from,setFrom]=useState("");const[to,setTo]=useState("");
  const empty={date:today(),symbol:"USDT",quantity:"",unit_price:"",client:"",pay_method:"transferencia",notes:"",payType:"contado",initial_paid:"",due_date:""};
  const[form,setForm]=useState(empty);
  const[file,setFile]=useState(null);
  const f=k=>v=>setForm(p=>({...p,[k]:v}));

  const filtered=sales.filter(s=>inPeriod(s.date,period,from,to));
  const rev=filtered.reduce((a,s)=>a+s.total,0);
  const profit=filtered.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const curInv=inventory.find(i=>i.symbol===form.symbol);
  const estProfit=curInv&&form.quantity&&form.unit_price?(+form.quantity*+form.unit_price)-(+form.quantity*+curInv.avg_cost):null;

  const save=async()=>{
    if(!form.quantity||!form.unit_price){toast("Completa cantidad y precio","error");return;}
    if(!curInv||+curInv.quantity<+form.quantity){
      toast(`Inventario insuficiente. Disponible: ${fmtQ(curInv?curInv.quantity:0,form.symbol)} ${form.symbol}`,"error");return;
    }
    setSaving(true);
    try{
      const r=await api.addSale(form,file);
      await reload();
      setModal(false);setForm(empty);setFile(null);
      toast(`Venta registrada · Utilidad: ${fmt(r.gross_profit||0)}`);
    }catch(e){toast(e.message,"error");}
    finally{setSaving(false);}
  };

  const cols=[
    {key:"date",label:"Fecha"},
    {key:"symbol",label:"Moneda",render:v=><b style={{color:COIN_C[v]||C.accent,fontFamily:"monospace"}}>{v}</b>},
    {key:"quantity",label:"Cantidad",render:(v,r)=><span style={{fontFamily:"monospace"}}>{fmtQ(v,r.symbol)}</span>},
    {key:"unit_price",label:"P.Venta",render:v=>fmt(v)},
    {key:"total",label:"Ingreso",render:v=>fmt(v)},
    {key:"gross_profit",label:"Utilidad",render:v=><b style={{color:v>=0?C.green:C.rose}}>{fmt(v)}</b>},
    {key:"st",label:"Estado",render:(_,r)=><Badge label={statusOf(r)} color={ST_C[statusOf(r)]}/>},
    {key:"client",label:"Cliente"},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Ventas de Criptomonedas" sub={`${sales.length} operaciones`} action="Nueva Venta" onAction={()=>setModal(true)}/>
    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Ingresos" value={fmtK(rev)} accent={C.blue}/>
      <Stat label="Utilidad" value={fmtK(profit)} accent={C.green}/>
      <Stat label="Margen" value={`${rev>0?((profit/rev)*100).toFixed(2):0}%`} accent={C.accentL}/>
      <Stat label="Por Cobrar (período)" value={fmtK(filtered.reduce((a,s)=>a+pendOf(s),0))} accent={C.amber}/>
    </div>
    <div style={{display:"flex",justifyContent:"flex-end"}}>
      <Btn small variant="secondary" onClick={()=>exportCSV(
        ["Fecha","Moneda","Cantidad","P.Venta","CPP","Ingreso","Costo","Utilidad","Pagado","Pendiente","Estado","Vence","Cliente","Método"],
        filtered.map(s=>[s.date,s.symbol,s.quantity,s.unit_price,s.avg_cost_used,s.total,s.cogs,s.gross_profit,s.paid||0,pendOf(s),statusOf(s),s.due_date||"",s.client||"",s.pay_method||""]),
        `ventas-${today()}.csv`)}>📥 Excel</Btn>
    </div>
    <Tabla cols={cols} rows={filtered} emptyMsg="Sin ventas en este período"/>

    {modal&&<Modal title="Nueva Venta" onClose={()=>{setModal(false);setForm(empty);setFile(null);}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Fecha" type="date" value={form.date} onChange={f("date")}/>
          <Sel label="Moneda" value={form.symbol} onChange={f("symbol")} options={
            inventory.filter(i=>+i.quantity>0).length>0
              ? inventory.filter(i=>+i.quantity>0).map(i=>({value:i.symbol,label:`${i.symbol} · ${fmtQ(i.quantity,i.symbol)} disp.`}))
              : [{value:"USDT",label:"USDT (sin inventario)"}]
          }/>
        </div>
        {curInv&&<div style={{background:C.panel,borderRadius:8,padding:10,display:"flex",gap:14,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:C.muted}}>Disponible: <b style={{color:COIN_C[form.symbol]}}>{fmtQ(curInv.quantity,form.symbol)}</b></span>
          <span style={{fontSize:12,color:C.muted}}>CPP: <b>{fmt(curInv.avg_cost)}</b></span>
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Cantidad" type="number" value={form.quantity} onChange={f("quantity")} placeholder="Ej: 10000"/>
          <Inp label="Precio unit. COP" type="number" value={form.unit_price} onChange={f("unit_price")} placeholder="Ej: 3580"/>
        </div>
        {estProfit!==null&&<div style={{background:estProfit>=0?"#0D2B1D":"#2D1218",border:`1px solid ${estProfit>=0?C.green:C.rose}`,borderRadius:8,padding:12,display:"flex",gap:14,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:C.muted}}>Ingreso: <b style={{color:C.text}}>{fmt(+form.quantity*+form.unit_price)}</b></span>
          <span style={{fontSize:13,color:C.muted}}>Costo: <b style={{color:C.rose}}>{fmt(+form.quantity*+curInv.avg_cost)}</b></span>
          <span style={{fontSize:13,color:C.muted}}>Utilidad: <b style={{color:estProfit>=0?C.green:C.rose,fontSize:15}}>{fmt(estProfit)}</b></span>
        </div>}
        <Inp label="Cliente" value={form.client} onChange={f("client")} list="cli-dl" placeholder="Nombre o alias"/>
        <datalist id="cli-dl">{clients.map(c=><option key={c.id} value={c.name}/>)}</datalist>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Sel label="Forma de pago" value={form.payType} onChange={f("payType")} options={[{value:"contado",label:"💵 Contado"},{value:"credito",label:"📅 Crédito"}]}/>
          <Sel label="Método" value={form.pay_method} onChange={f("pay_method")} options={METHODS.map(m=>({value:m,label:m.charAt(0).toUpperCase()+m.slice(1)}))}/>
        </div>
        {form.payType==="credito"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,background:"#2a1f0a",border:`1px solid ${C.amber}`,borderRadius:8,padding:10}}>
          <Inp label="Abono inicial" type="number" value={form.initial_paid} onChange={f("initial_paid")} placeholder="0"/>
          <Inp label="Fecha vencimiento" type="date" value={form.due_date} onChange={f("due_date")}/>
        </div>}
        <Inp label="Notas" value={form.notes} onChange={f("notes")}/>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <label style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:"uppercase"}}>📎 Comprobante (opcional)</label>
          <input type="file" accept="image/*,.pdf" onChange={e=>setFile(e.target.files&&e.target.files[0]||null)}/>
        </div>
        <Btn onClick={save} disabled={saving} full>{saving?"Procesando...":"Registrar Venta"}</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── CARTERA ──────────────────────────────────────────────────────────────
function CarteraModule({sales,purchases,payments,reload,toast}){
  const[tab,setTab]=useState("cobrar");
  const[payCtx,setPayCtx]=useState(null);

  const cobrar=sales.filter(s=>pendOf(s)>0.01).sort((a,b)=>(a.due_date||"9999").localeCompare(b.due_date||"9999"));
  const pagar=purchases.filter(p=>pendOf(p)>0.01).sort((a,b)=>(a.due_date||"9999").localeCompare(b.due_date||"9999"));
  const totCobrar=cobrar.reduce((a,s)=>a+pendOf(s),0);
  const totPagar=pagar.reduce((a,p)=>a+pendOf(p),0);
  const totVencido=cobrar.filter(s=>statusOf(s)==="vencido").reduce((a,s)=>a+pendOf(s),0);

  const mkCols=isC=>[
    {key:"date",label:"Fecha Op."},
    {key:isC?"client":"supplier",label:isC?"Cliente":"Proveedor",render:v=><b>{v||"—"}</b>},
    {key:"symbol",label:"Op.",render:(v,r)=><span style={{fontSize:11,color:C.muted}}>{fmtQ(r.quantity,v)} {v}</span>},
    {key:"total",label:"Total",render:v=>fmt(v)},
    {key:"paid",label:"Pagado",render:v=><span style={{color:C.green}}>{fmt(v||0)}</span>},
    {key:"pend",label:"Pendiente",render:(_,r)=><b style={{color:C.amber}}>{fmt(pendOf(r))}</b>},
    {key:"due_date",label:"Vence",render:v=>v||"—"},
    {key:"mora",label:"Mora",render:(_,r)=>moraOf(r)>0?<b style={{color:C.rose}}>{moraOf(r)} días</b>:"—"},
    {key:"st",label:"Estado",render:(_,r)=><Badge label={statusOf(r)} color={ST_C[statusOf(r)]}/>},
    {key:"act",label:"",render:(_,r)=><Btn small onClick={()=>setPayCtx({
      title:isC?"Recibir Abono":"Realizar Abono",
      party:isC?r.client:r.supplier,direction:isC?"recibido":"realizado",
      reference_type:isC?"sale":"purchase",reference_id:r.id,maxAmount:pendOf(r)
    })}>💰 Abonar</Btn>},
  ];

  const payCols=[
    {key:"date",label:"Fecha"},
    {key:"party",label:"Persona",render:v=><b>{v}</b>},
    {key:"direction",label:"Tipo",render:v=><span style={{color:v==="recibido"?C.green:C.rose,fontWeight:700,fontSize:11,textTransform:"uppercase"}}>{v}</span>},
    {key:"amount",label:"Valor",render:(v,r)=><b style={{color:r.direction==="recibido"?C.green:C.rose}}>{r.direction==="recibido"?"+":"-"}{fmt(v)}</b>},
    {key:"method",label:"Método"},
    {key:"notes",label:"Notas"},
    {key:"receipt_url",label:"Soporte",render:v=>v?<a href={v} target="_blank" rel="noopener" style={{color:C.blue,fontSize:12}}>📎 Ver</a>:"—"},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Cartera y Créditos" sub="cuentas por cobrar y por pagar"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
      <Stat label="Por Cobrar" value={fmtK(totCobrar)} accent={C.amber} sub={`${cobrar.length} cuentas`}/>
      <Stat label="Vencido" value={fmtK(totVencido)} accent={totVencido>0?C.rose:C.muted} sub={`${cobrar.filter(s=>statusOf(s)==="vencido").length} cuentas`}/>
      <Stat label="Por Pagar" value={fmtK(totPagar)} accent={C.rose} sub={`${pagar.length} cuentas`}/>
      <Stat label="Posición Neta" value={fmtK(totCobrar-totPagar)} accent={totCobrar-totPagar>=0?C.green:C.rose}/>
    </div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <Pill label={`📥 Por Cobrar (${cobrar.length})`} active={tab==="cobrar"} onClick={()=>setTab("cobrar")}/>
      <Pill label={`📤 Por Pagar (${pagar.length})`} active={tab==="pagar"} onClick={()=>setTab("pagar")}/>
      <Pill label={`🧾 Pagos (${payments.length})`} active={tab==="pagos"} onClick={()=>setTab("pagos")}/>
    </div>
    {tab!=="pagos"&&<div style={{display:"flex",justifyContent:"flex-end"}}>
      <Btn small variant="secondary" onClick={()=>{
        const rows=tab==="cobrar"?cobrar:pagar;
        exportCSV(["Fecha","Persona","Moneda","Cantidad","Total","Pagado","Pendiente","Vence","Mora","Estado"],
          rows.map(r=>[r.date,tab==="cobrar"?r.client:r.supplier,r.symbol,r.quantity,r.total,r.paid||0,pendOf(r),r.due_date||"",moraOf(r),statusOf(r)]),
          `cartera-${tab}-${today()}.csv`);
      }}>📥 Excel</Btn>
    </div>}
    {tab==="cobrar"&&<Tabla cols={mkCols(true)} rows={cobrar} emptyMsg="🎉 Sin cuentas por cobrar"/>}
    {tab==="pagar"&&<Tabla cols={mkCols(false)} rows={pagar} emptyMsg="🎉 Sin cuentas por pagar"/>}
    {tab==="pagos"&&<Tabla cols={payCols} rows={payments} emptyMsg="Sin pagos registrados"/>}
    {payCtx&&<PaymentModal ctx={payCtx} onClose={()=>setPayCtx(null)} reload={reload} toast={toast}/>}
  </div>;
}

// ─── CLIENTES ─────────────────────────────────────────────────────────────
function ClientFormModal({client,onClose,reload,toast}){
  const[form,setForm]=useState(client?{name:client.name||"",phone:client.phone||"",email:client.email||"",city:client.city||"",notes:client.notes||"",status:client.status||"activo",tags:client.tags||[]}:{name:"",phone:"",email:"",city:"",notes:"",status:"activo",tags:[]});
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const toggleTag=t=>setForm(p=>({...p,tags:p.tags.includes(t)?p.tags.filter(x=>x!==t):[...p.tags,t]}));
  const save=async()=>{
    if(!form.name){toast("El nombre es requerido","error");return;}
    try{
      if(client)await api.updateClient(client.id,form);
      else await api.addClient(form);
      await reload();onClose();toast(client?"Cliente actualizado":"Cliente creado");
    }catch(e){toast(e.message,"error");}
  };
  return <Modal title={client?"Editar Cliente":"Nuevo Cliente"} onClose={onClose}>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <Inp label="Nombre o alias" value={form.name} onChange={f("name")}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Teléfono" value={form.phone} onChange={f("phone")}/>
        <Inp label="Correo" value={form.email} onChange={f("email")}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Ciudad" value={form.city} onChange={f("city")}/>
        <Sel label="Estado" value={form.status} onChange={f("status")} options={[{value:"activo",label:"🟢 Activo"},{value:"inactivo",label:"⚪ Inactivo"}]}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        <label style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:"uppercase"}}>Etiquetas</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {TAGS.map(t=><Pill key={t} label={t} active={form.tags.includes(t)} onClick={()=>toggleTag(t)} color={TAG_C[t]}/>)}
        </div>
      </div>
      <Inp label="Observaciones" value={form.notes} onChange={f("notes")}/>
      <Btn onClick={save} full>{client?"Guardar Cambios":"Crear Cliente"}</Btn>
    </div>
  </Modal>;
}

function ClientsModule({clients,sales,purchases,payments,reload,toast}){
  const[search,setSearch]=useState("");
  const[sortBy,setSortBy]=useState("profit");
  const[tagFilter,setTagFilter]=useState("all");
  const[formModal,setFormModal]=useState(false);
  const[editClient,setEditClient]=useState(null);
  const[detail,setDetail]=useState(null);

  const enriched=useMemo(()=>clients.map(c=>{
    const st=clientStats(c,sales,purchases,payments);
    return {...c,_ops:st.ops,_vol:st.volCOP,_profit:st.profit,_usdt:st.volBySym.USDT||0,_last:st.last,_saldo:st.saldo};
  }),[clients,sales,purchases,payments]);

  const filtered=enriched
    .filter(c=>(norm(c.name).includes(norm(search))||norm(c.city).includes(norm(search))||norm(c.phone).includes(norm(search)))
      &&(tagFilter==="all"||(tagFilter==="activo"||tagFilter==="inactivo"?((c.status||"activo")===tagFilter):(c.tags||[]).includes(tagFilter))))
    .sort((a,b)=>sortBy==="profit"?b._profit-a._profit:sortBy==="vol"?b._vol-a._vol:sortBy==="ops"?b._ops-a._ops:a.name.localeCompare(b.name));

  const cols=[
    {key:"name",label:"Cliente",render:(v,r)=><div>
      <b>{v}</b>{(r.status||"activo")==="inactivo"&&<span style={{fontSize:9,color:C.muted}}> · inactivo</span>}
      <div style={{display:"flex",gap:4,marginTop:2}}>{(r.tags||[]).map(t=><Badge key={t} label={t} color={TAG_C[t]||C.slate}/>)}</div>
    </div>},
    {key:"_ops",label:"Ops"},
    {key:"_vol",label:"Volumen",render:v=><span style={{color:C.blue,fontWeight:600}}>{fmtK(v)}</span>},
    {key:"_usdt",label:"USDT",render:v=><span style={{color:COIN_C.USDT,fontFamily:"monospace"}}>{fmtQ(v,"USDT")}</span>},
    {key:"_profit",label:"Utilidad",render:v=><b style={{color:v>=0?C.green:C.rose}}>{fmtK(v)}</b>},
    {key:"_saldo",label:"Saldo",render:v=>Math.abs(v)<0.01?<span style={{color:C.muted}}>Al día</span>:v>0?<b style={{color:C.amber}}>Debe {fmtK(v)}</b>:<b style={{color:C.blue}}>A favor {fmtK(-v)}</b>},
    {key:"_last",label:"Última Op."},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Clientes" sub={`${clients.length} registrados · toca un cliente para ver su ficha completa`} action="Nuevo Cliente" onAction={()=>{setEditClient(null);setFormModal(true);}}/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <Search value={search} onChange={setSearch} placeholder="Buscar nombre, ciudad o teléfono..."/>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {[["profit","Más rentables"],["vol","Más volumen"],["ops","Más activos"],["name","A-Z"]].map(([v,l])=>
          <Pill key={v} label={l} active={sortBy===v} onClick={()=>setSortBy(v)}/>)}
      </div>
    </div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <Pill label="Todos" active={tagFilter==="all"} onClick={()=>setTagFilter("all")}/>
      {TAGS.map(t=><Pill key={t} label={t} active={tagFilter===t} onClick={()=>setTagFilter(t)} color={TAG_C[t]}/>)}
      <Pill label="Activos" active={tagFilter==="activo"} onClick={()=>setTagFilter("activo")} color={C.green}/>
      <Pill label="Inactivos" active={tagFilter==="inactivo"} onClick={()=>setTagFilter("inactivo")} color={C.slate}/>
    </div>
    <Tabla cols={cols} rows={filtered} onRowClick={setDetail} emptyMsg="Sin clientes"/>
    {formModal&&<ClientFormModal client={editClient} onClose={()=>setFormModal(false)} reload={reload} toast={toast}/>}
    {detail&&<ClientFicha client={clients.find(c=>c.id===detail.id)||detail} sales={sales} purchases={purchases} payments={payments}
      onClose={()=>setDetail(null)} onEdit={()=>{setEditClient(clients.find(c=>c.id===detail.id)||detail);setDetail(null);setFormModal(true);}}
      reload={reload} toast={toast}/>}
  </div>;
}

function ClientFicha({client,sales,purchases,payments,onClose,onEdit,reload,toast}){
  const[tab,setTab]=useState("extracto");
  const[period,setPeriod]=useState("all");
  const[from,setFrom]=useState("");const[to,setTo]=useState("");
  const[printing,setPrinting]=useState(false);
  const[payCtx,setPayCtx]=useState(null);

  const st=useMemo(()=>clientStats(client,sales,purchases,payments),[client,sales,purchases,payments]);
  const ledger=st.ledger.filter(r=>inPeriod(r.date,period,from,to));
  const ops=[...st.vs.map(s=>({...s,_t:"venta"})),...st.cs.map(p=>({...p,_t:"compra"}))]
    .filter(o=>inPeriod(o.date,period,from,to)).sort((a,b)=>b.date.localeCompare(a.date));

  const months=[...Array(12)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(11-i));return d.toISOString().slice(0,7);});
  const activity=months.map(m=>[...st.vs,...st.cs].filter(o=>o.date.slice(0,7)===m).reduce((a,o)=>a+o.total,0)/1000);
  const mLabels=months.map(m=>["E","F","M","A","M","J","J","A","S","O","N","D"][+m.slice(5,7)-1]);

  const exportExtracto=()=>exportCSV(
    ["Fecha","Concepto","Débito","Crédito","Saldo"],
    ledger.map(r=>[r.date,r.concept,r.debit||"",r.credit||"",r.saldo]),
    `extracto-${client.name.replace(/\s+/g,"-")}-${today()}.csv`);

  const ledCols=[
    {key:"date",label:"Fecha"},
    {key:"concept",label:"Concepto",render:(v,r)=><span>{v}{r.receipt&&<a href={r.receipt} target="_blank" rel="noopener" style={{color:C.blue,marginLeft:6,fontSize:11}}>📎</a>}</span>},
    {key:"debit",label:"Débito",render:v=>v?<span style={{color:C.amber}}>{fmt(v)}</span>:"—"},
    {key:"credit",label:"Crédito",render:v=>v?<span style={{color:C.green}}>{fmt(v)}</span>:"—"},
    {key:"saldo",label:"Saldo",render:v=><b style={{color:Math.abs(v)<0.01?C.muted:v>0?C.amber:C.blue,fontFamily:"monospace"}}>{fmt(v)}</b>},
  ];

  const opCols=[
    {key:"date",label:"Fecha"},
    {key:"_t",label:"Tipo",render:v=><span style={{color:v==="venta"?C.rose:C.green,fontWeight:700,fontSize:11,textTransform:"uppercase"}}>{v==="venta"?"↑ Venta":"↓ Compra"}</span>},
    {key:"symbol",label:"Moneda",render:v=><b style={{color:COIN_C[v]||C.accent,fontFamily:"monospace"}}>{v}</b>},
    {key:"quantity",label:"Cantidad",render:(v,r)=>fmtQ(v,r.symbol)},
    {key:"total",label:"Total",render:v=><b>{fmt(v)}</b>},
    {key:"gross_profit",label:"Utilidad",render:(v,r)=>r._t==="venta"?<b style={{color:(v||0)>=0?C.green:C.rose}}>{fmt(v||0)}</b>:<span style={{color:C.muted}}>—</span>},
    {key:"st",label:"Estado",render:(_,r)=><Badge label={statusOf(r)} color={ST_C[statusOf(r)]}/>},
  ];

  return <React.Fragment>
    <Modal title={`📒 ${client.name}`} onClose={onClose} wide>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:12,color:C.muted}}>
            {client.phone&&<span>📞 {client.phone}</span>}
            {client.email&&<span>✉️ {client.email}</span>}
            {client.city&&<span>📍 {client.city}</span>}
            <span>🗓 Cliente desde: <b style={{color:C.text}}>{st.since||"—"}</b></span>
            <span>⏱ Última op: <b style={{color:C.text}}>{st.last||"—"}</b></span>
            <Badge label={(client.status||"activo")==="activo"?"Activo":"Inactivo"} color={(client.status||"activo")==="activo"?C.green:C.slate}/>
            {(client.tags||[]).map(t=><Badge key={t} label={t} color={TAG_C[t]||C.slate}/>)}
          </div>
          <Btn small variant="secondary" onClick={onEdit}>✏️ Editar</Btn>
        </div>
        {client.notes&&<p style={{margin:0,fontSize:12,color:C.muted,background:C.panel,padding:"8px 12px",borderRadius:8}}>💬 {client.notes}</p>}

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(125px,1fr))",gap:8}}>
          <Stat small label="Saldo" value={Math.abs(st.saldo)<0.01?"Al día":fmtK(Math.abs(st.saldo))} accent={Math.abs(st.saldo)<0.01?C.green:st.saldo>0?C.amber:C.blue} sub={Math.abs(st.saldo)<0.01?"":st.saldo>0?"a favor de la empresa":"a favor del cliente"}/>
          <Stat small label="Por Cobrar" value={fmtK(st.porCobrar)} accent={st.porCobrar>0?C.amber:C.muted}/>
          <Stat small label="Por Pagar" value={fmtK(st.porPagar)} accent={st.porPagar>0?C.rose:C.muted}/>
          <Stat small label="Total Cobrado" value={fmtK(st.totalCobrado)} accent={C.green}/>
          <Stat small label="Total Pagado" value={fmtK(st.totalPagado)} accent={C.rose}/>
          <Stat small label="Utilidad Generada" value={fmtK(st.profit)} accent={C.green}/>
        </div>

        <div style={{background:C.panel,borderRadius:10,padding:14}}>
          <h4 style={{margin:"0 0 10px",fontSize:13,fontWeight:600}}>Perfil Comercial</h4>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",fontSize:12,color:C.muted}}>
            <span>Operaciones: <b style={{color:C.text}}>{st.ops}</b></span>
            <span>Vol. COP: <b style={{color:C.blue}}>{fmt(st.volCOP)}</b></span>
            <span>Vol. USDT: <b style={{color:COIN_C.USDT}}>{fmtQ(st.volBySym.USDT||0,"USDT")}</b></span>
            <span>Ticket promedio: <b style={{color:C.text}}>{fmt(st.ticket)}</b></span>
            <span>Le vendimos: <b style={{color:C.text}}>{fmtK(st.totalVendido)}</b></span>
            <span>Le compramos: <b style={{color:C.text}}>{fmtK(st.totalComprado)}</b></span>
            <span>Frec. venta: <b style={{color:C.text}}>{st.freqVenta}/mes</b></span>
            <span>Frec. compra: <b style={{color:C.text}}>{st.freqCompra}/mes</b></span>
          </div>
          <div style={{marginTop:12}}>
            {activity.some(v=>v>0)?<Bars data={activity} labels={mLabels} color={C.accent} h={70}/>:<p style={{color:C.muted,fontSize:12,margin:0}}>Sin actividad</p>}
          </div>
        </div>

        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <Pill label="📑 Extracto (Libro Mayor)" active={tab==="extracto"} onClick={()=>setTab("extracto")}/>
          <Pill label="🪙 Operaciones" active={tab==="ops"} onClick={()=>setTab("ops")}/>
        </div>
        <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
        {tab==="extracto"?<Tabla cols={ledCols} rows={ledger} emptyMsg="Sin movimientos"/>:<Tabla cols={opCols} rows={ops} emptyMsg="Sin operaciones"/>}

        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn variant="secondary" onClick={()=>setPayCtx({title:"Recibir Pago / Abono",party:client.name,direction:"recibido",maxAmount:st.porCobrar})}>💰 Recibir Pago</Btn>
          <Btn variant="secondary" onClick={()=>setPayCtx({title:"Realizar Pago",party:client.name,direction:"realizado",maxAmount:st.porPagar})}>💸 Pagar</Btn>
          <Btn variant="secondary" onClick={exportExtracto}>📥 Excel</Btn>
          <Btn variant="secondary" onClick={()=>setPrinting(true)}>🖨️ Estado de Cuenta PDF</Btn>
          {client.phone&&<Btn variant="secondary" onClick={()=>window.open(`https://wa.me/57${(client.phone||"").replace(/[-\s]/g,"")}`,"_blank")}>📲 WhatsApp</Btn>}
        </div>
      </div>
    </Modal>

    {payCtx&&<PaymentModal ctx={payCtx} onClose={()=>setPayCtx(null)} reload={reload} toast={toast}/>}

    {printing&&<div id="print-area" style={{position:"fixed",inset:0,background:"#fff",color:"#111",zIndex:1000,overflowY:"auto",padding:28,fontFamily:"Inter,sans-serif"}}>
      <div className="no-print" style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={()=>window.print()} style={{padding:"9px 18px",background:"#26A17B",color:"#fff",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer"}}>🖨️ Imprimir / PDF</button>
        <button onClick={()=>setPrinting(false)} style={{padding:"9px 18px",background:"#eee",color:"#111",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer"}}>Cerrar</button>
      </div>
      <h1 style={{margin:"0 0 2px",fontSize:22}}>Estado de Cuenta — {client.name}</h1>
      <p style={{margin:"0 0 14px",fontSize:12,color:"#666"}}>Generado: {new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})} · Casa de Cambio Digital</p>
      <div style={{display:"flex",gap:20,flexWrap:"wrap",marginBottom:16,fontSize:13}}>
        <span><b>Operaciones:</b> {st.ops}</span>
        <span><b>Volumen:</b> {fmt(st.volCOP)}</span>
        <span><b>USDT:</b> {fmtQ(st.volBySym.USDT||0,"USDT")}</span>
        <span><b>Saldo:</b> {Math.abs(st.saldo)<0.01?"Al día":`${fmt(Math.abs(st.saldo))} ${st.saldo>0?"(debe a la empresa)":"(a favor del cliente)"}`}</span>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
        <thead><tr style={{background:"#f3f3f3"}}>
          {["Fecha","Concepto","Débito","Crédito","Saldo"].map(h=><th key={h} style={{padding:"7px 9px",textAlign:"left",borderBottom:"2px solid #ddd"}}>{h}</th>)}
        </tr></thead>
        <tbody>
          {ledger.map(r=><tr key={r.id}>
            <td style={{padding:"6px 9px",borderBottom:"1px solid #eee"}}>{r.date}</td>
            <td style={{padding:"6px 9px",borderBottom:"1px solid #eee"}}>{r.concept}</td>
            <td style={{padding:"6px 9px",borderBottom:"1px solid #eee"}}>{r.debit?fmt(r.debit):""}</td>
            <td style={{padding:"6px 9px",borderBottom:"1px solid #eee"}}>{r.credit?fmt(r.credit):""}</td>
            <td style={{padding:"6px 9px",borderBottom:"1px solid #eee",fontWeight:600}}>{fmt(r.saldo)}</td>
          </tr>)}
        </tbody>
      </table>
    </div>}
  </React.Fragment>;
}

// ─── PROVEEDORES ──────────────────────────────────────────────────────────
function SuppliersModule({suppliers,purchases,reload,toast}){
  const[modal,setModal]=useState(false);
  const empty={name:"",contact:"",phone:"",notes:""};
  const[form,setForm]=useState(empty);
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const enriched=suppliers.map(s=>{
    const ops=purchases.filter(p=>norm(p.supplier)===norm(s.name));
    return {...s,_ops:ops.length,_vol:ops.reduce((a,p)=>a+p.total,0),_usdt:ops.filter(p=>p.symbol==="USDT").reduce((a,p)=>a+ +p.quantity,0),_pend:ops.reduce((a,p)=>a+pendOf(p),0)};
  }).sort((a,b)=>b._vol-a._vol);
  const save=async()=>{
    if(!form.name){toast("El nombre es requerido","error");return;}
    try{ await api.addSupplier(form);await reload();setModal(false);setForm(empty);toast("Proveedor creado"); }
    catch(e){toast(e.message,"error");}
  };
  const cols=[
    {key:"name",label:"Proveedor",render:v=><b>{v}</b>},
    {key:"phone",label:"Teléfono"},
    {key:"_ops",label:"Compras"},
    {key:"_vol",label:"Volumen",render:v=><span style={{color:C.amber,fontWeight:600}}>{fmtK(v)}</span>},
    {key:"_usdt",label:"USDT",render:v=><span style={{color:COIN_C.USDT,fontFamily:"monospace"}}>{fmtQ(v,"USDT")}</span>},
    {key:"_pend",label:"Le Debemos",render:v=>v>0.01?<b style={{color:C.rose}}>{fmt(v)}</b>:<span style={{color:C.muted}}>Al día</span>},
  ];
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Proveedores de Liquidez" sub={`${suppliers.length} proveedores`} action="Nuevo" onAction={()=>setModal(true)}/>
    <Tabla cols={cols} rows={enriched} emptyMsg="Sin proveedores"/>
    {modal&&<Modal title="Nuevo Proveedor" onClose={()=>{setModal(false);setForm(empty);}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Nombre / alias" value={form.name} onChange={f("name")}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Contacto" value={form.contact} onChange={f("contact")}/>
          <Inp label="Teléfono" value={form.phone} onChange={f("phone")}/>
        </div>
        <Inp label="Notas" value={form.notes} onChange={f("notes")}/>
        <Btn onClick={save} full>Guardar</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── INVENTARIO ───────────────────────────────────────────────────────────
function InventoryModule({inventory,kardex}){
  const[tab,setTab]=useState("pos");
  const[filterSym,setFilterSym]=useState("all");
  const totalInv=inventory.reduce((a,i)=>a+(+i.total_invested||0),0);
  const totalProfit=inventory.reduce((a,i)=>a+(+i.accumulated_profit||0),0);
  const fk=filterSym==="all"?kardex:kardex.filter(k=>k.symbol===filterSym);

  const posCols=[
    {key:"symbol",label:"Moneda",render:v=><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{width:9,height:9,borderRadius:"50%",background:COIN_C[v]||C.accent}}/><b style={{fontFamily:"monospace"}}>{v}</b></div>},
    {key:"quantity",label:"Cantidad",render:(v,r)=><span style={{fontFamily:"monospace",color:+v>0?C.text:C.muted}}>{fmtQ(v,r.symbol)}</span>},
    {key:"avg_cost",label:"CPP",render:v=>fmt(v)},
    {key:"total_invested",label:"Invertido",render:v=><span style={{color:C.amber,fontWeight:600}}>{fmt(v)}</span>},
    {key:"accumulated_profit",label:"Utilidad",render:v=><b style={{color:v>=0?C.green:C.rose}}>{fmt(v)}</b>},
    {key:"roi_pct",label:"ROI",render:v=><span style={{color:v>=0?C.green:C.rose,fontWeight:600}}>{v}%</span>},
  ];
  const kCols=[
    {key:"date",label:"Fecha"},
    {key:"symbol",label:"Moneda",render:v=><b style={{color:COIN_C[v]||C.accent,fontFamily:"monospace"}}>{v}</b>},
    {key:"type",label:"Tipo",render:v=><span style={{color:v==="compra"?C.green:v==="venta"?C.rose:C.amber,fontWeight:700,fontSize:11,textTransform:"uppercase"}}>{v}</span>},
    {key:"quantity",label:"Cantidad",render:(v,r)=><span style={{color:v>=0?C.green:C.rose,fontFamily:"monospace"}}>{v>=0?"+":""}{fmtQ(Math.abs(v),r.symbol)}</span>},
    {key:"unit_cost",label:"Precio",render:v=>fmt(v)},
    {key:"balance_qty",label:"Saldo",render:(v,r)=><span style={{fontFamily:"monospace"}}>{fmtQ(v,r.symbol)}</span>},
    {key:"balance_avg",label:"CPP Saldo",render:v=>fmt(v)},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Inventario Crypto"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Capital en Posición" value={fmtK(totalInv)} accent={C.amber}/>
      <Stat label="Utilidad Acumulada" value={fmtK(totalProfit)} accent={C.green}/>
      <Stat label="ROI" value={`${totalInv>0?((totalProfit/totalInv)*100).toFixed(1):0}%`} accent={C.accentL}/>
      <Stat label="Monedas Activas" value={inventory.filter(i=>+i.quantity>0).length}/>
    </div>
    <div style={{display:"flex",gap:6,justifyContent:"space-between",flexWrap:"wrap"}}>
      <div style={{display:"flex",gap:6}}>
        <Pill label="📦 Posición" active={tab==="pos"} onClick={()=>setTab("pos")}/>
        <Pill label="📋 Kardex" active={tab==="kdx"} onClick={()=>setTab("kdx")}/>
      </div>
      <Btn small variant="secondary" onClick={()=>tab==="pos"
        ?exportCSV(["Moneda","Cantidad","CPP","Invertido","Utilidad","ROI%"],inventory.map(i=>[i.symbol,i.quantity,i.avg_cost,i.total_invested,i.accumulated_profit,i.roi_pct]),`inventario-${today()}.csv`)
        :exportCSV(["Fecha","Moneda","Tipo","Cantidad","Precio","Total","Saldo","CPP"],fk.map(k=>[k.date,k.symbol,k.type,k.quantity,k.unit_cost,k.total,k.balance_qty,k.balance_avg]),`kardex-${today()}.csv`)
      }>📥 Excel</Btn>
    </div>
    {tab==="kdx"&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      {["all",...new Set(kardex.map(k=>k.symbol))].map(s=><Pill key={s} label={s==="all"?"Todas":s} active={filterSym===s} onClick={()=>setFilterSym(s)}/>)}
    </div>}
    {tab==="pos"?<Tabla cols={posCols} rows={inventory} emptyMsg="Sin posiciones"/>:<Tabla cols={kCols} rows={fk} emptyMsg="Sin movimientos"/>}
  </div>;
}

// ─── FLUJO DE CAJA ────────────────────────────────────────────────────────
function CashFlowModule({cashflow,reload,toast}){
  const[modal,setModal]=useState(false);
  const[filter,setFilter]=useState("all");
  const[period,setPeriod]=useState("month");
  const[from,setFrom]=useState("");const[to,setTo]=useState("");
  const empty={date:today(),type:"ingreso",description:"",amount:"",method:"transferencia"};
  const[form,setForm]=useState(empty);
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const balance=cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0);
  const filtered=cashflow.filter(e=>inPeriod(e.date,period,from,to)&&(filter==="all"||e.type===filter));
  const ing=filtered.filter(e=>e.type==="ingreso").reduce((a,e)=>a+e.amount,0);
  const egr=filtered.filter(e=>e.type==="egreso").reduce((a,e)=>a+e.amount,0);
  const save=async()=>{
    if(!form.amount||+form.amount<=0){toast("Valor inválido","error");return;}
    try{ await api.addCashFlow(form);await reload();setModal(false);setForm(empty);toast("Movimiento registrado"); }
    catch(e){toast(e.message,"error");}
  };
  const cols=[
    {key:"date",label:"Fecha"},
    {key:"type",label:"Tipo",render:v=><span style={{color:v==="ingreso"?C.green:C.rose,fontWeight:700,fontSize:11,textTransform:"uppercase"}}>{v}</span>},
    {key:"description",label:"Descripción"},
    {key:"method",label:"Método"},
    {key:"amount",label:"Valor",render:(v,r)=><b style={{color:r.type==="ingreso"?C.green:C.rose}}>{r.type==="ingreso"?"+":"-"}{fmt(v)}</b>},
    {key:"del",label:"",render:(_,r)=><button onClick={async e=>{e.stopPropagation();try{await api.delCashFlow(r.id);await reload();toast("Eliminado");}catch(er){toast(er.message,"error");}}} style={{fontSize:11,background:"#2D1218",border:`1px solid ${C.rose}`,color:C.rose,borderRadius:6,padding:"2px 8px",cursor:"pointer"}}>✕</button>},
  ];
  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Flujo de Caja" action="Movimiento" onAction={()=>setModal(true)}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Saldo Total" value={fmtK(balance)} accent={balance>=0?C.accentL:C.rose}/>
      <Stat label="Ingresos" value={fmtK(ing)} accent={C.green}/>
      <Stat label="Egresos" value={fmtK(egr)} accent={C.rose}/>
      <Stat label="Neto" value={fmtK(ing-egr)} accent={ing-egr>=0?C.green:C.rose}/>
    </div>
    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"flex",gap:6,justifyContent:"space-between",flexWrap:"wrap"}}>
      <div style={{display:"flex",gap:6}}>
        {[["all","Todos"],["ingreso","Ingresos"],["egreso","Egresos"]].map(([v,l])=><Pill key={v} label={l} active={filter===v} onClick={()=>setFilter(v)}/>)}
      </div>
      <Btn small variant="secondary" onClick={()=>exportCSV(["Fecha","Tipo","Descripción","Método","Valor"],filtered.map(e=>[e.date,e.type,e.description,e.method,e.amount]),`flujo-caja-${today()}.csv`)}>📥 Excel</Btn>
    </div>
    <Tabla cols={cols} rows={filtered} emptyMsg="Sin movimientos"/>
    {modal&&<Modal title="Nuevo Movimiento" onClose={()=>{setModal(false);setForm(empty);}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Fecha" type="date" value={form.date} onChange={f("date")}/>
          <Sel label="Tipo" value={form.type} onChange={f("type")} options={[{value:"ingreso",label:"Ingreso"},{value:"egreso",label:"Egreso"}]}/>
        </div>
        <Inp label="Descripción" value={form.description} onChange={f("description")} placeholder="Ej: Aporte de capital"/>
        <Inp label="Valor" type="number" value={form.amount} onChange={f("amount")}/>
        <Sel label="Método" value={form.method} onChange={f("method")} options={METHODS.map(m=>({value:m,label:m.charAt(0).toUpperCase()+m.slice(1)}))}/>
        <Btn onClick={save} full>Registrar</Btn>
      </div>
    </Modal>}

}

// ─── RENTABILIDAD ─────────────────────────────────────────────────────────
function ProfitModule({sales,purchases,expenses}){
  const[period,setPeriod]=useState("month");
  const[from,setFrom]=useState("");const[to,setTo]=useState("");
  const fs=sales.filter(s=>inPeriod(s.date,period,from,to));
  const fe=expenses.filter(e=>inPeriod(e.date,period,from,to));
  const rev=fs.reduce((a,s)=>a+s.total,0);
  const cogs=fs.reduce((a,s)=>a+(+s.cogs||0),0);
  const gross=fs.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const exp=fe.reduce((a,e)=>a+e.amount,0);
  const net=gross-exp;
  const margin=rev>0?((net/rev)*100).toFixed(2):0;

  const dayMap={};fs.forEach(s=>dayMap[s.date]=(dayMap[s.date]||0)+(+s.gross_profit||0));
  const days=Object.keys(dayMap).sort().slice(-31);

  const bySym=COINS.map(sym=>({sym,
    rev:fs.filter(s=>s.symbol===sym).reduce((a,s)=>a+s.total,0),
    profit:fs.filter(s=>s.symbol===sym).reduce((a,s)=>a+(+s.gross_profit||0),0),
    ops:fs.filter(s=>s.symbol===sym).length,
  })).filter(r=>r.ops>0).sort((a,b)=>b.profit-a.profit);

  const byCli={};fs.forEach(s=>{const k=norm(s.client)||"(sin nombre)";if(!byCli[k])byCli[k]={name:s.client||"(sin nombre)",profit:0,ops:0};byCli[k].profit+=(+s.gross_profit||0);byCli[k].ops++;});
  const topCli=Object.values(byCli).sort((a,b)=>b.profit-a.profit).slice(0,8);

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Rentabilidad" sub="utilidad real con costo promedio ponderado"/>
    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Ingresos" value={fmtK(rev)} accent={C.blue}/>
      <Stat label="Costo Vendido" value={fmtK(cogs)} accent={C.rose}/>
      <Stat label="Utilidad Bruta" value={fmtK(gross)} accent={C.amber}/>
      <Stat label="Gastos" value={fmtK(exp)} accent={C.rose}/>
      <Stat label="Utilidad Neta" value={fmtK(net)} accent={net>=0?C.green:C.rose}/>
      <Stat label="Margen Neto" value={`${margin}%`} accent={+margin>1.5?C.green:+margin>0.5?C.amber:C.rose}/>
    </div>
    <div style={{display:"flex",justifyContent:"flex-end"}}>
      <Btn small variant="secondary" onClick={()=>exportCSV(
        ["Fecha","Moneda","Cantidad","P.Venta","CPP","Ingreso","Costo","Utilidad","Cliente"],
        fs.map(s=>[s.date,s.symbol,s.quantity,s.unit_price,s.avg_cost_used,s.total,s.cogs,s.gross_profit,s.client||""]),
        `rentabilidad-${today()}.csv`)}>📥 Excel</Btn>
    </div>

    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:20}}>
      <h4 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>Estado de Resultados</h4>
      {[
        {l:"(+) Ingresos por ventas",v:rev,c:C.text},
        {l:"(−) Costo de criptomonedas vendidas",v:cogs,c:C.rose},
        {l:"= Utilidad bruta",v:gross,c:C.amber,b:1},
        {l:"(−) Gastos operativos",v:exp,c:C.rose},
        {l:"= Utilidad neta",v:net,c:net>=0?C.green:C.rose,b:1,big:1},
      ].map((r,i,arr)=><div key={r.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none"}}>
        <span style={{fontSize:r.big?15:13,fontWeight:r.b?700:400}}>{r.l}</span>
        <span style={{fontSize:r.big?19:14,fontWeight:r.b?700:500,color:r.c,fontFamily:"monospace"}}>{fmt(r.v)}</span>
      </div>)}
    </div>

    {days.length>1&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
      <h4 style={{margin:"0 0 12px",fontSize:14,fontWeight:600}}>Utilidad por Día</h4>
      <Bars data={days.map(d=>Math.max(0,dayMap[d]))} labels={days.map(d=>d.slice(8))} color={C.green} h={90}/>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14}}>
      {bySym.length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
        <h4 style={{margin:"0 0 14px",fontSize:14,fontWeight:600}}>Utilidad por Moneda</h4>
        {bySym.map(r=><div key={r.sym} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:COIN_C[r.sym],marginRight:8}}/>{r.sym} <span style={{color:C.muted,fontSize:11}}>({r.ops})</span></span>
          <b style={{color:r.profit>=0?C.green:C.rose}}>{fmt(r.profit)}</b>
        </div>)}
      </div>}
      {topCli.length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
        <h4 style={{margin:"0 0 14px",fontSize:14,fontWeight:600}}>Utilidad por Cliente</h4>
        {topCli.map((r,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
          <span>{r.name} <span style={{color:C.muted,fontSize:11}}>({r.ops})</span></span>
          <b style={{color:r.profit>=0?C.green:C.rose}}>{fmt(r.profit)}</b>
        </div>)}
      </div>}
    </div>
  </div>;
}

// ─── METAS ────────────────────────────────────────────────────────────────
function GoalsModule({goals,sales,purchases,clients,cashflow,inventory,reload,toast}){
  const[scope,setScope]=useState("month");
  const[modal,setModal]=useState(false);
  const key=scope==="month"?monthKey():yearKey();
  const g=goals.find(x=>x.month===key)||{};
  const[form,setForm]=useState({});
  const f=k=>v=>setForm(p=>({...p,[k]:v}));

  const fs=sales.filter(s=>scope==="month"?s.date.slice(0,7)===key:s.date.slice(0,4)===key);
  const fp=purchases.filter(p=>scope==="month"?p.date.slice(0,7)===key:p.date.slice(0,4)===key);
  const profit=fs.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const vol=fs.reduce((a,s)=>a+s.total,0)+fp.reduce((a,p)=>a+p.total,0);
  const newClients=clients.filter(c=>c.created_at&&(scope==="month"?c.created_at.slice(0,7)===key:c.created_at.slice(0,4)===key)).length;
  const actives=new Set();[...fs,...fp].forEach(o=>{const n=o.client||o.supplier;if(n)actives.add(norm(n));});
  const capital=cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0);
  const invested=inventory.reduce((a,i)=>a+(+i.total_invested||0),0);

  const now=new Date();
  const dayN=scope==="month"?now.getDate():Math.ceil((now-new Date(now.getFullYear(),0,1))/86400000);
  const dayT=scope==="month"?new Date(now.getFullYear(),now.getMonth()+1,0).getDate():365;
  const proj=v=>dayN>0?Math.round(v/dayN*dayT):0;
  const eta=(cur,target)=>{
    if(target<=0)return"—";if(cur>=target)return"✓ Cumplida";
    const rate=cur/dayN;if(rate<=0)return"sin ritmo";
    const need=Math.ceil((target-cur)/rate);
    const d=new Date();d.setDate(d.getDate()+need);
    const limit=scope==="month"?new Date(now.getFullYear(),now.getMonth()+1,0):new Date(now.getFullYear(),11,31);
    return d<=limit?d.toLocaleDateString("es-CO",{day:"numeric",month:"short"}):"fuera del período";
  };

  const metrics=[
    {key:"profit_goal",label:"Utilidad",cur:profit,color:C.green,f:fmtK,proj:1},
    {key:"sales_goal",label:"Volumen",cur:vol,color:C.blue,f:fmtK,proj:1},
    {key:"clients_goal",label:"Clientes Nuevos",cur:newClients,color:C.purple,f:v=>v,proj:1},
    {key:"active_clients_goal",label:"Clientes Activos",cur:actives.size,color:C.amber,f:v=>v,proj:0},
    {key:"capital_goal",label:"Capital (caja)",cur:capital,color:C.accentL,f:fmtK,proj:0},
    {key:"inventory_goal",label:"Inventario COP",cur:invested,color:COIN_C.USDT,f:fmtK,proj:0},
  ];

  const openEdit=()=>{const init={};metrics.forEach(m=>init[m.key]=g[m.key]||"");setForm(init);setModal(true);};
  const save=async()=>{
    try{
      const payload={};metrics.forEach(m=>payload[m.key]=+form[m.key]||0);
      await api.saveGoal(key,payload);await reload();
      setModal(false);toast("Metas guardadas");
    }catch(e){toast(e.message,"error");}
  };

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Metas y Objetivos" sub={scope==="month"?`Mes: ${key}`:`Año: ${key}`} action="Editar Metas" onAction={openEdit}/>
    <div style={{display:"flex",gap:6}}>
      <Pill label="📅 Mensuales" active={scope==="month"} onClick={()=>setScope("month")}/>
      <Pill label="🗓 Anuales" active={scope==="year"} onClick={()=>setScope("year")}/>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {metrics.map(m=>{
        const target=+g[m.key]||0;
        const pct=target>0?Math.min(100,Math.round((m.cur/target)*100)):0;
        return <div key={m.key} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:8}}>
            <b style={{fontSize:14}}>{m.label}</b>
            <div style={{display:"flex",gap:14,fontSize:12,color:C.muted,flexWrap:"wrap"}}>
              <span>Actual: <b style={{color:m.color}}>{m.f(m.cur)}</b></span>
              <span>Meta: <b style={{color:C.text}}>{target>0?m.f(target):"sin definir"}</b></span>
              {target>0&&<span>Avance: <b style={{color:pct>=100?C.green:m.color}}>{pct}%</b></span>}
              {target>0&&m.proj===1&&<span>Proyección: <b style={{color:proj(m.cur)>=target?C.green:C.amber}}>{m.f(proj(m.cur))}</b></span>}
              {target>0&&m.proj===1&&<span>ETA: <b style={{color:C.text}}>{eta(m.cur,target)}</b></span>}
            </div>
          </div>
          <div style={{height:8,background:C.border,borderRadius:4}}>
            <div style={{height:"100%",background:pct>=100?C.green:m.color,borderRadius:4,width:`${pct}%`,transition:"width .5s"}}/>
          </div>
        </div>;
      })}
    </div>
    {modal&&<Modal title={`Metas ${scope==="month"?"del Mes":"del Año"}`} onClose={()=>setModal(false)}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {metrics.map(m=><Inp key={m.key} label={`Meta ${m.label}${m.proj===1?" (proyectable)":""}`} type="number" value={form[m.key]||""} onChange={f(m.key)}/>)}
        <Btn onClick={save} full>Guardar Metas</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── CIERRES ──────────────────────────────────────────────────────────────
function ClosingsModule({closings,sales,purchases,expenses,cashflow,inventory,reload,toast}){
  const[saving,setSaving]=useState(false);
  const[detail,setDetail]=useState(null);

  const gen=async(type)=>{
    const t=today();
    let start=t;
    if(type==="semanal"){const d=new Date();d.setDate(d.getDate()-6);start=d.toISOString().split("T")[0];}
    if(type==="mensual")start=monthKey()+"-01";
    const fs=sales.filter(s=>s.date>=start&&s.date<=t);
    const fp=purchases.filter(p=>p.date>=start&&p.date<=t);
    const fe=expenses.filter(e=>e.date>=start&&e.date<=t);
    const gross=fs.reduce((a,s)=>a+(+s.gross_profit||0),0);
    const exp=fe.reduce((a,e)=>a+e.amount,0);
    setSaving(true);
    try{
      await api.addClosing({
        type,period_start:start,period_end:t,
        purchases_total:fp.reduce((a,p)=>a+p.total,0),
        sales_total:fs.reduce((a,s)=>a+s.total,0),
        gross_profit:gross,expenses_total:exp,net_profit:gross-exp,
        cash_balance:cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0),
        inventory_value:inventory.reduce((a,i)=>a+(+i.total_invested||0),0),
        inventory_snapshot:inventory.map(i=>({symbol:i.symbol,qty:+i.quantity,avg:+i.avg_cost,inv:+i.total_invested})),
        notes:`${fs.length} ventas · ${fp.length} compras`
      });
      await reload();toast(`Cierre ${type} generado`);
    }catch(e){toast(e.message,"error");}
    finally{setSaving(false);}
  };

  const cols=[
    {key:"created_at",label:"Generado",render:v=>v&&v.slice(0,16).replace("T"," ")},
    {key:"type",label:"Tipo",render:v=><Badge label={v} color={v==="diario"?C.blue:v==="semanal"?C.amber:C.purple}/>},
    {key:"per",label:"Período",render:(_,r)=><span style={{fontSize:12}}>{r.period_start} → {r.period_end}</span>},
    {key:"sales_total",label:"Ventas",render:v=><span style={{color:C.blue}}>{fmtK(v)}</span>},
    {key:"purchases_total",label:"Compras",render:v=><span style={{color:C.amber}}>{fmtK(v)}</span>},
    {key:"net_profit",label:"Utilidad Neta",render:v=><b style={{color:v>=0?C.green:C.rose}}>{fmtK(v)}</b>},
    {key:"cash_balance",label:"Caja",render:v=>fmtK(v)},
    {key:"inventory_value",label:"Inventario",render:v=>fmtK(v)},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Cierres Contables" sub="fotografía financiera del negocio"/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <Btn onClick={()=>gen("diario")} disabled={saving}>☀️ Cierre Diario</Btn>
      <Btn variant="secondary" onClick={()=>gen("semanal")} disabled={saving}>📅 Cierre Semanal</Btn>
      <Btn variant="secondary" onClick={()=>gen("mensual")} disabled={saving}>🗓 Cierre Mensual</Btn>
      <div style={{flex:1}}/>
      <Btn small variant="secondary" onClick={()=>exportCSV(
        ["Generado","Tipo","Inicio","Fin","Ventas","Compras","Ut.Bruta","Gastos","Ut.Neta","Caja","Inventario"],
        closings.map(c=>[c.created_at&&c.created_at.slice(0,16),c.type,c.period_start,c.period_end,c.sales_total,c.purchases_total,c.gross_profit,c.expenses_total,c.net_profit,c.cash_balance,c.inventory_value]),
        `cierres-${today()}.csv`)}>📥 Excel</Btn>
    </div>
    <Tabla cols={cols} rows={closings} onRowClick={setDetail} emptyMsg="Sin cierres — genera el primero"/>
    {detail&&<Modal title={`Cierre ${detail.type} · ${detail.period_end}`} onClose={()=>setDetail(null)}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {[["Período",`${detail.period_start} → ${detail.period_end}`],["Ventas",fmt(detail.sales_total)],["Compras",fmt(detail.purchases_total)],["Utilidad bruta",fmt(detail.gross_profit)],["Gastos",fmt(detail.expenses_total)],["Utilidad neta",fmt(detail.net_profit)],["Saldo en caja",fmt(detail.cash_balance)],["Valor inventario",fmt(detail.inventory_value)]].map(([l,v])=>
          <div key={l} style={{display:"flex",justifyContent:"space-between",borderBottom:`1px solid ${C.border}`,padding:"7px 0",fontSize:13}}>
            <span style={{color:C.muted}}>{l}</span><b>{v}</b>
          </div>)}
        {detail.inventory_snapshot&&<div>
          <h4 style={{margin:"8px 0",fontSize:13}}>Inventario al cierre</h4>
          {(detail.inventory_snapshot||[]).filter(i=>i.qty>0).map(i=><div key={i.symbol} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0",color:C.muted}}>
            <span style={{color:COIN_C[i.symbol]||C.text,fontFamily:"monospace"}}>{i.symbol}</span>
            <span>{fmtQ(i.qty,i.symbol)} · CPP {fmt(i.avg)} · {fmt(i.inv)}</span>
          </div>)}
        </div>}
      </div>
    </Modal>}
  </div>;
}

  {id:"cartera",icon:"📋",label:"Cartera",g:"Clientes"},
  {id:"suppliers",icon:"🏦",label:"Proveedores",g:"Clientes"},
  {id:"cash",icon:"💳",label:"Flujo de Caja",g:"Finanzas"},

function App(){

  const[active,setActive]=useState("dash");
  const[sidebar,setSidebar]=useState(false);
  const[loading,setLoading]=useState(false);

  const[clients,setClients]=useState([]);
  const[suppliers,setSuppliers]=useState([]);
  const[inventory,setInventory]=useState([]);
  const[purchases,setPurchases]=useState([]);
  const[sales,setSales]=useState([]);
  const[kardex,setKardex]=useState([]);
  const[payments,setPayments]=useState([]);
  const[cashflow,setCashflow]=useState([]);
  const[expenses,setExpenses]=useState([]);
  const[goals,setGoals]=useState([]);
  const[closings,setClosings]=useState([]);

  const reload=async()=>{
    const[cl,su,inv,pu,sa,ka,pa,cf,ex,go,cz]=await Promise.all([
      api.getClients(),api.getSuppliers(),api.getInventory(),
      api.getPurchases(),api.getSales(),api.getKardex(),api.getPayments(),
      api.getCashFlow(),api.getExpenses(),api.getGoals(),api.getClosings()
    ]);
    setClients(cl);setSuppliers(su);setInventory(inv);
    setPurchases(pu);setSales(sa);setKardex(ka);setPayments(pa);
    setCashflow(cf);setExpenses(ex);setGoals(go);setClosings(cz);
  };

  useEffect(()=>{
    api.session().then(async u=>{
      if(u){ setUser(u); setLoading(true); try{await reload();}catch(e){} setLoading(false); }
    }).finally(()=>setChecking(false));
  },[]);

  const handleLogin=async u=>{
    setUser(u);setLoading(true);
    try{await reload();}catch(e){toast("Error cargando datos","error");}
    setLoading(false);
  };

  const W=typeof window!=="undefined"?window.innerWidth:1024;
  const isMobile=W<768;
  const SW=225;

  if(checking) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:14}}>Cargando...</div>;
  if(!user) return <Login onLogin={handleLogin}/>;

  const navItem=NAV.find(n=>n.id===active)||NAV[0];
  const props={clients,suppliers,inventory,purchases,sales,kardex,payments,cashflow,expenses,goals,closings,reload,toast,setActive};

  const Module=()=>{
    if(loading) return <div style={{padding:60,textAlign:"center",color:C.muted}}>Cargando datos...</div>;
    switch(active){
      case "dash":     return <Dashboard {...props}/>;
      case "buy":      return <PurchasesModule {...props}/>;
      case "sell":     return <SalesModule {...props}/>;
      case "inv":      return <InventoryModule {...props}/>;
      case "clients":  return <ClientsModule {...props}/>;
      case "cartera":  return <CarteraModule {...props}/>;
      case "suppliers":return <SuppliersModule {...props}/>;
      case "cash":     return <CashFlowModule {...props}/>;
      case "exp":      return <ExpensesModule {...props}/>;
      case "profit":   return <ProfitModule {...props}/>;
      case "goals":    return <GoalsModule {...props}/>;
      case "closings": return <ClosingsModule {...props}/>;
      default: return null;
    }
  };

  return <div style={{minHeight:"100vh",background:C.bg,display:"flex"}}>
    {sidebar&&<div onClick={()=>setSidebar(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:40}}/>}

    <nav style={{width:SW,background:C.panel,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",position:"fixed",top:0,bottom:0,left:0,zIndex:50,transform:isMobile?`translateX(${sidebar?0:-SW}px)`:"none",transition:"transform .25s"}}>
      <div style={{padding:"18px 14px 12px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:26,color:C.accentL}}>₿</span>
          <div>
            <div style={{fontSize:13,fontWeight:800}}>Casa de Cambio <span style={{fontSize:9,color:C.accentL,verticalAlign:"super"}}>PRO</span></div>
            <div style={{fontSize:10,color:C.muted}}>{user.name||user.email}</div>
          </div>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"6px 8px"}}>
        {GROUPS.map(g=><div key={g} style={{marginBottom:6}}>
          <div style={{fontSize:9,color:C.slate,textTransform:"uppercase",letterSpacing:1,padding:"6px 12px 3px",fontWeight:700}}>{g}</div>
          {NAV.filter(n=>n.g===g).map(n=><button key={n.id}
            onClick={()=>{setActive(n.id);setSidebar(false);}}
            style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"8px 12px",background:active===n.id?`${C.accent}1A`:"transparent",border:`1px solid ${active===n.id?C.accent:"transparent"}`,borderRadius:8,cursor:"pointer",textAlign:"left",marginBottom:1,color:active===n.id?C.accentL:C.muted,fontSize:13,fontWeight:active===n.id?600:400}}>
            <span style={{fontSize:14}}>{n.icon}</span>{n.label}
          </button>)}
        </div>)}
      </div>
      <div style={{padding:"10px 14px",borderTop:`1px solid ${C.border}`}}>
        <div style={{fontSize:11,color:C.muted,marginBottom:7}}>👤 {user.role==="admin"?"Administrador":"Empleado"}</div>
        <button onClick={()=>setActive(active)&&null||setTimeout(()=>api.logout().then(()=>setUser(null)),0)} style={{width:"100%",padding:7,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,cursor:"pointer",fontSize:12,textAlign:"center"}}
          onClick={async()=>{ await api.logout(); setUser(null); }}>
          Cerrar sesión
        </button>
      </div>
    </nav>

    <div style={{marginLeft:isMobile?0:SW,flex:1,display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      <header style={{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"0 16px",height:50,display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:30}}>
        {isMobile&&<button onClick={()=>setSidebar(s=>!s)} style={{background:"none",border:"none",color:C.muted,fontSize:20,cursor:"pointer",padding:4}}>☰</button>}
        <span style={{fontSize:15}}>{navItem.icon}</span>
        <h2 style={{margin:0,fontSize:15,fontWeight:700,flex:1}}>{navItem.label}</h2>
        <button onClick={async()=>{setLoading(true);try{await reload();toast("Datos actualizados");}catch(e){toast(e.message,"error");}setLoading(false);}}
          style={{background:"none",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>🔄</button>
        <div style={{fontSize:11,color:C.muted}}>{new Date().toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"})}</div>
      </header>
      <main style={{flex:1,padding:"16px 14px 40px",maxWidth:1400,width:"100%",margin:"0 auto"}}>
        <Module/>
      </main>
    </div>

    {toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onDone={()=>remove(t.id)}/>)}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
