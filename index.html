let UID = null; // user id actual — se asigna en login

// ─── Tokens ───────────────────────────────────────────────────────────────
const C = {
  bg:"#070C16",panel:"#0E1522",card:"#151E30",card2:"#1B2640",border:"#1E2D45",
  accent:"#26A17B",accentL:"#3DD9A4",blue:"#4F6EF7",green:"#10B981",

const COINS = ["USDT","USDC","BTC","ETH","BNB","TRX","SOL","DAI"];
const COIN_C = {USDT:"#26A17B",USDC:"#2775CA",BTC:"#F7931A",ETH:"#627EEA",BNB:"#F3BA2F",TRX:"#FF0013",SOL:"#9945FF",DAI:"#F5AC37"};

// ─── Helpers ──────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const fmtK = n => { const a=Math.abs(n||0); if(a>=1e9)return`$${(n/1e9).toFixed(1)}MM`; if(a>=1e6)return`$${(n/1e6).toFixed(1)}M`; if(a>=1e3)return`$${(n/1e3).toFixed(0)}K`; return`$${Math.round(n||0)}`; };
const fmtQ = (n,s) => { const d=s==="BTC"?8:(s==="ETH"||s==="SOL")?4:2; return parseFloat((+n||0).toFixed(d)).toLocaleString("es-CO",{maximumFractionDigits:d}); };
const today = () => new Date().toISOString().split("T")[0];
const norm = s => (s||"").trim().toLowerCase();
const monthKey = () => today().slice(0,7);

function inPeriod(dateStr, p, from, to){
  if(!dateStr) return false;
  if(p==="all") return true;
  if(p==="today") return dateStr===today();
  if(p==="week"){ const d=new Date(dateStr+"T12:00:00"); const lim=new Date(); lim.setDate(lim.getDate()-7); return d>=lim; }
  if(p==="month") return dateStr.slice(0,7)===monthKey();
  if(p==="year") return dateStr.slice(0,4)===today().slice(0,4);
  if(p==="custom") return (!from||dateStr>=from)&&(!to||dateStr<=to);
  return true;
}

function exportCSV(headers, rows, filename){
  const all=[headers,...rows];
  const csv=all.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

// ─── API ──────────────────────────────────────────────────────────────────
const api = {
  async session(){
    const {data}=await sb.auth.getSession();
    if(!data?.session) return null;
    UID=data.session.user.id;
    const {data:p}=await sb.from("profiles").select("*").eq("id",UID).maybeSingle();
    return {...data.session.user,...(p||{})};
  },
  async login(email,pass){
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) throw error;
    UID=data.user.id;
    const {data:p}=await sb.from("profiles").select("*").eq("id",UID).maybeSingle();
    return {...data.user,...(p||{})};
  },
  async logout(){ await sb.auth.signOut(); UID=null; },

  async getClients(){ const{data,error}=await sb.from("clients").select("*").order("name"); if(error)throw error; return data||[]; },
  async addClient(c){ const{data,error}=await sb.from("clients").insert({...c,user_id:UID}).select().single(); if(error)throw error; return data; },
  async updateClient(id,c){ const{data,error}=await sb.from("clients").update(c).eq("id",id).select().single(); if(error)throw error; return data; },

  async getSuppliers(){ const{data,error}=await sb.from("suppliers").select("*").order("name"); if(error)throw error; return data||[]; },
  async addSupplier(s){ const{data,error}=await sb.from("suppliers").insert({...s,user_id:UID}).select().single(); if(error)throw error; return data; },

  async getInventory(){ const{data,error}=await sb.from("crypto_inventory_view").select("*"); if(error)throw error; return data||[]; },
  async getKardex(){ const{data,error}=await sb.from("crypto_kardex").select("*").order("created_at",{ascending:false}); if(error)throw error; return data||[]; },

  async getPurchases(){ const{data,error}=await sb.from("crypto_purchases").select("*").order("date",{ascending:false}).order("created_at",{ascending:false}); if(error)throw error; return data||[]; },
  async addPurchase(p){
    const total=+p.quantity*+p.unit_cost;
    const{data,error}=await sb.from("crypto_purchases").insert({
      user_id:UID,date:p.date,symbol:p.symbol,quantity:+p.quantity,
      unit_cost:+p.unit_cost,total,currency:"COP",
      supplier:(p.supplier||"").trim(),pay_method:p.pay_method,notes:p.notes
    }).select().single();
    if(error)throw error;
    const{error:e2}=await sb.rpc("process_crypto_purchase",{
      p_id:data.id,p_user_id:UID,p_date:data.date,p_symbol:data.symbol,
      p_quantity:data.quantity,p_cost:data.unit_cost,p_total:data.total
    });
    if(e2)throw e2;
    await sb.from("cash_flow").insert({
      user_id:UID,date:p.date,type:"egreso",
      description:`Compra ${fmtQ(p.quantity,p.symbol)} ${p.symbol} @ ${fmt(+p.unit_cost)}`,
      amount:total,method:p.pay_method||"transferencia",notes:`Proveedor: ${p.supplier||"—"}`
    });
    return data;
  },

  async getSales(){ const{data,error}=await sb.from("crypto_sales").select("*").order("date",{ascending:false}).order("created_at",{ascending:false}); if(error)throw error; return data||[]; },
  async addSale(s){
    const total=+s.quantity*+s.unit_price;
    const{data,error}=await sb.from("crypto_sales").insert({
      user_id:UID,date:s.date,symbol:s.symbol,quantity:+s.quantity,
      unit_price:+s.unit_price,total,avg_cost_used:0,cogs:0,gross_profit:0,
      currency:"COP",client:(s.client||"").trim(),pay_method:s.pay_method,notes:s.notes
    }).select().single();
    if(error)throw error;
    const{data:calc,error:e2}=await sb.rpc("process_crypto_sale",{
      p_id:data.id,p_user_id:UID,p_date:data.date,p_symbol:data.symbol,
      p_quantity:data.quantity,p_price:data.unit_price,p_total:data.total
    });
    if(e2)throw e2;
    await sb.from("cash_flow").insert({
      user_id:UID,date:s.date,type:"ingreso",
      description:`Venta ${fmtQ(s.quantity,s.symbol)} ${s.symbol} @ ${fmt(+s.unit_price)}`,
      amount:total,method:s.pay_method||"transferencia",notes:`Cliente: ${s.client||"—"}`
    });
    return {...data,...(calc?.[0]||{})};
  },

  async getCashFlow(){ const{data,error}=await sb.from("cash_flow").select("*").order("date",{ascending:false}).order("created_at",{ascending:false}); if(error)throw error; return data||[]; },
  async addCashFlow(e){ const{data,error}=await sb.from("cash_flow").insert({...e,user_id:UID,amount:+e.amount}).select().single(); if(error)throw error; return data; },
  async delCashFlow(id){ const{error}=await sb.from("cash_flow").delete().eq("id",id); if(error)throw error; },

  async getExpenses(){ const{data,error}=await sb.from("expenses").select("*").order("date",{ascending:false}); if(error)throw error; return data||[]; },
  async addExpense(e){ const{data,error}=await sb.from("expenses").insert({...e,user_id:UID,amount:+e.amount}).select().single(); if(error)throw error; return data; },
  async delExpense(id){ const{error}=await sb.from("expenses").delete().eq("id",id); if(error)throw error; },

  async getGoal(){ const{data}=await sb.from("goals").select("*").eq("month",monthKey()).maybeSingle(); return data; },
  async saveGoal(g){
    const{data,error}=await sb.from("goals").upsert({user_id:UID,month:monthKey(),...g},{onConflict:"user_id,month"}).select().single();
    if(error)throw error; return data;
  },
};

// ─── UI Primitives ────────────────────────────────────────────────────────
function Spark({data,color=C.accent,h=38,w=90}){
  if(!data||data.length<2)return null;
  const min=Math.min(...data),max=Math.max(...data),r=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/r)*(h-6)-3}`).join(" ");
  const[lx,ly]=pts.split(" ").pop().split(",");
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{flexShrink:0}}>
    <polyline fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" points={pts}/>
    <circle cx={lx} cy={ly} r="3" fill={color}/>
  </svg>;
}

function Bars({data,labels,color=C.accent,h=90}){
  const max=Math.max(...data,1);
  return <div style={{display:"flex",alignItems:"flex-end",gap:4,height:h}}>
    {data.map((v,i)=>(
      <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
        <div style={{width:"100%",background:color,borderRadius:"3px 3px 0 0",height:`${Math.max(2,(v/max)*(h-18))}px`,transition:"height .4s"}}/>
        <span style={{fontSize:8,color:C.muted}}>{labels[i]}</span>
      </div>
    ))}
  </div>;
}

function Btn({children,onClick,variant="primary",danger,disabled,full,small}){

    style={{background:bg,color:C.white,border:`1px solid ${bc}`,borderRadius:8,padding:small?"6px 13px":"9px 18px",fontSize:small?12:14,fontWeight:600,cursor:disabled?"not-allowed":"pointer",whiteSpace:"nowrap",width:full?"100%":undefined,opacity:disabled?.5:1}}>

function Tabla({cols,rows,onRowClick,emptyMsg="Sin registros"}){
  return <div style={{overflowX:"auto",borderRadius:10,border:`1px solid ${C.border}`}}>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
      <thead><tr style={{background:C.panel}}>
        {cols.map(c=><th key={c.key} style={{padding:"9px 13px",textAlign:"left",color:C.muted,fontWeight:600,fontSize:10,letterSpacing:.8,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap",textTransform:"uppercase"}}>{c.label}</th>)}
      </tr></thead>
      <tbody>
        {rows.length===0&&<tr><td colSpan={cols.length} style={{padding:32,textAlign:"center",color:C.muted}}>{emptyMsg}</td></tr>}

          <tr key={row.id||ri} onClick={()=>onRowClick&&onRowClick(row)}

        ))}

function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t);},[]);
  return <div style={{position:"fixed",bottom:24,right:16,left:16,maxWidth:420,marginLeft:"auto",background:C.card,border:`1px solid ${type==="error"?C.rose:C.green}`,borderRadius:10,padding:"12px 16px",zIndex:999,color:C.text,fontSize:13,fontWeight:500,boxShadow:"0 8px 32px rgba(0,0,0,.5)",display:"flex",gap:10,alignItems:"center"}}>
    <span style={{color:type==="error"?C.rose:C.green}}>{type==="error"?"✕":"✓"}</span>{msg}
  </div>;
}

function useToast(){
  const[toasts,setToasts]=useState([]);
  const show=(msg,type="success")=>setToasts(t=>[...t,{id:Date.now()+Math.random(),msg,type}]);
  return {toasts,show,remove:id=>setToasts(t=>t.filter(x=>x.id!==id))};
}

function PeriodBar({period,setPeriod,from,setFrom,to,setTo}){

function Dashboard({inventory,sales,purchases,cashflow,expenses,clients,goal,onSaveGoal,toast}){
  const[goalModal,setGoalModal]=useState(false);
  const[gForm,setGForm]=useState({profit_goal:goal?.profit_goal||"",sales_goal:goal?.sales_goal||"",clients_goal:goal?.clients_goal||""});

  const capital=cashflow.reduce((a,e)=>a+(e.type==="ingreso"?e.amount:-e.amount),0);
  const usdtInv=inventory.find(i=>i.symbol==="USDT");
  const totalInvested=inventory.reduce((a,i)=>a+(+i.total_invested||0),0);

  const todayP=purchases.filter(p=>p.date===today());
  const todayS=sales.filter(s=>s.date===today());
  const monthS=sales.filter(s=>s.date.slice(0,7)===monthKey());
  const monthP=purchases.filter(p=>p.date.slice(0,7)===monthKey());
  const prevMonth=(()=>{const d=new Date();d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})();
  const prevMonthVol=sales.filter(s=>s.date.slice(0,7)===prevMonth).reduce((a,s)=>a+s.total,0);

  const dayProfit=todayS.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const monthProfit=monthS.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const monthVol=monthS.reduce((a,s)=>a+s.total,0)+monthP.reduce((a,p)=>a+p.total,0);
  const monthExp=expenses.filter(e=>e.date.slice(0,7)===monthKey()).reduce((a,e)=>a+e.amount,0);
  const netMonth=monthProfit-monthExp;
  const growth=prevMonthVol>0?Math.round(((monthS.reduce((a,s)=>a+s.total,0)-prevMonthVol)/prevMonthVol)*100):null;
  const margin=monthS.reduce((a,s)=>a+s.total,0)>0?((monthProfit/monthS.reduce((a,s)=>a+s.total,0))*100).toFixed(1):0;

  // Últimos 14 días — utilidad y volumen
  const last14=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(13-i));return d.toISOString().split("T")[0];});
  const profitSeries=last14.map(d=>sales.filter(s=>s.date===d).reduce((a,s)=>a+(+s.gross_profit||0),0));
  const volSeries=last14.map(d=>sales.filter(s=>s.date===d).reduce((a,s)=>a+s.total,0)/1000);
  const dayLabels=last14.map(d=>d.slice(8));

  // Top clientes por utilidad
  const byClient={};
  sales.forEach(s=>{const k=norm(s.client)||"(sin nombre)";if(!byClient[k])byClient[k]={name:s.client||"(sin nombre)",profit:0,vol:0,ops:0};byClient[k].profit+=(+s.gross_profit||0);byClient[k].vol+=s.total;byClient[k].ops++;});
  const topClients=Object.values(byClient).sort((a,b)=>b.profit-a.profit).slice(0,5);

  const saveGoal=async()=>{
    try{
      await onSaveGoal({profit_goal:+gForm.profit_goal||0,sales_goal:+gForm.sales_goal||0,clients_goal:+gForm.clients_goal||0});
      setGoalModal(false);toast("Metas guardadas");
    }catch(e){toast(e.message,"error");}
  };

  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    {/* KPI principal */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
      <Stat label="Capital Disponible" value={fmtK(capital)} accent={capital>=0?C.accentL:C.rose} sub="flujo de caja"/>
      <Stat label="Inventario USDT" value={fmtQ(usdtInv?.quantity||0,"USDT")} accent={COIN_C.USDT} sub={usdtInv?`CPP ${fmt(usdtInv.avg_cost)}`:"sin posición"}/>
      <Stat label="Valor Inventario" value={fmtK(totalInvested)} accent={C.amber} sub="costo total COP"/>
      <Stat label="Utilidad Hoy" value={fmtK(dayProfit)} accent={dayProfit>=0?C.green:C.rose} sub={`${todayS.length} ventas · ${todayP.length} compras`}/>
      <Stat label="Utilidad Mes" value={fmtK(monthProfit)} accent={C.green} spark={profitSeries} sparkColor={C.green}/>
      <Stat label="Utilidad Neta Mes" value={fmtK(netMonth)} accent={netMonth>=0?C.green:C.rose} sub={`gastos: ${fmtK(monthExp)}`}/>
    </div>

    {/* Indicadores */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
      <Stat label="Volumen Mes" value={fmtK(monthVol)} accent={C.blue} sub={`${monthS.length+monthP.length} operaciones`}/>
      <Stat label="Margen" value={`${margin}%`} accent={+margin>2?C.green:+margin>1?C.amber:C.rose} sub="utilidad / ventas"/>
      <Stat label="Crecimiento" value={growth===null?"—":`${growth>0?"+":""}${growth}%`} accent={growth>=0?C.green:C.rose} sub="vs mes anterior"/>
      <Stat label="Clientes" value={clients.length} sub={`${Object.keys(byClient).length} activos`}/>
    </div>

    {/* Gráficas */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14}}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
        <h4 style={{margin:"0 0 4px",color:C.text,fontSize:14,fontWeight:600}}>Volumen de Ventas</h4>
        <p style={{margin:"0 0 12px",fontSize:11,color:C.muted}}>Últimos 14 días (miles COP)</p>
        {volSeries.some(v=>v>0)
          ?<Bars data={volSeries} labels={dayLabels} color={C.accent} h={100}/>
          :<p style={{color:C.muted,fontSize:13,padding:"20px 0",textAlign:"center"}}>Sin ventas en los últimos 14 días</p>}
      </div>

      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
        <h4 style={{margin:"0 0 14px",color:C.text,fontSize:14,fontWeight:600}}>Top Clientes (utilidad)</h4>
        {topClients.length===0&&<p style={{color:C.muted,fontSize:13}}>Sin operaciones registradas</p>}
        {topClients.map((c,i)=>(
          <div key={i} style={{marginBottom:11}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
              <span style={{fontSize:13,color:C.text}}>{i+1}. {c.name}</span>
              <span style={{fontSize:12,color:C.green,fontWeight:600}}>{fmtK(c.profit)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <div style={{flex:1,height:4,background:C.border,borderRadius:2}}>
                <div style={{height:"100%",background:C.accent,borderRadius:2,width:`${topClients[0].profit>0?(c.profit/topClients[0].profit)*100:0}%`}}/>
              </div>
              <span style={{fontSize:10,color:C.muted}}>{c.ops} ops · {fmtK(c.vol)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>

    {/* Inventario por moneda */}
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
      <h4 style={{margin:"0 0 12px",color:C.text,fontSize:14,fontWeight:600}}>Posición por Moneda</h4>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        {inventory.filter(i=>+i.quantity>0).length===0&&<p style={{color:C.muted,fontSize:13}}>Sin posiciones abiertas — registra tu primera compra</p>}
        {inventory.filter(i=>+i.quantity>0).map(i=>(
          <div key={i.symbol} style={{background:C.card2,border:`1px solid ${COIN_C[i.symbol]||C.border}`,borderRadius:10,padding:"11px 15px",minWidth:150}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:COIN_C[i.symbol]||C.accent}}/>
              <b style={{color:C.text,fontSize:13,fontFamily:"monospace"}}>{i.symbol}</b>
            </div>
            <div style={{fontSize:16,fontWeight:700,color:COIN_C[i.symbol]||C.accent,fontFamily:"monospace"}}>{fmtQ(i.quantity,i.symbol)}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2}}>CPP {fmt(i.avg_cost)}</div>
            <div style={{fontSize:10,color:C.amber}}>{fmt(i.total_invested)}</div>
          </div>
        ))}
      </div>
    </div>

    {/* Metas */}
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h4 style={{margin:0,color:C.text,fontSize:14,fontWeight:600}}>Metas del Mes</h4>
        <Btn small variant="secondary" onClick={()=>{setGForm({profit_goal:goal?.profit_goal||"",sales_goal:goal?.sales_goal||"",clients_goal:goal?.clients_goal||""});setGoalModal(true);}}>Editar</Btn>
      </div>
      {[
        {label:"Utilidad",cur:monthProfit,target:+goal?.profit_goal||0,color:C.green,f:fmtK},
        {label:"Volumen",cur:monthVol,target:+goal?.sales_goal||0,color:C.blue,f:fmtK},
        {label:"Operaciones",cur:monthS.length+monthP.length,target:+goal?.clients_goal||0,color:C.amber,f:v=>v},
      ].map(m=>{
        const pct=m.target>0?Math.min(100,Math.round((m.cur/m.target)*100)):0;
        return <div key={m.label} style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:13,color:C.text}}>{m.label}</span>
            <span style={{fontSize:11,color:C.muted}}>{m.f(m.cur)} / {m.target>0?m.f(m.target):"sin meta"} {m.target>0&&<b style={{color:m.color}}>· {pct}%</b>}</span>
          </div>
          <div style={{height:6,background:C.border,borderRadius:3}}>
            <div style={{height:"100%",background:m.color,borderRadius:3,width:`${pct}%`,transition:"width .5s"}}/>
          </div>
        </div>;
      })}
    </div>

    {goalModal&&<Modal title="Metas del Mes" onClose={()=>setGoalModal(false)}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Inp label="Meta de utilidad (COP)" type="number" value={gForm.profit_goal} onChange={v=>setGForm(f=>({...f,profit_goal:v}))} placeholder="Ej: 5000000"/>
        <Inp label="Meta de volumen (COP)" type="number" value={gForm.sales_goal} onChange={v=>setGForm(f=>({...f,sales_goal:v}))} placeholder="Ej: 200000000"/>
        <Inp label="Meta de operaciones" type="number" value={gForm.clients_goal} onChange={v=>setGForm(f=>({...f,clients_goal:v}))} placeholder="Ej: 100"/>
        <Btn onClick={saveGoal} full>Guardar Metas</Btn>
      </div>
    </Modal>}
  </div>;
}

  const filtered=purchases.filter(p=>inPeriod(p.date,period,from,to));

      <Stat label="Invertido (período)" value={fmtK(totalCOP)} accent={C.amber}/>

      <Btn small variant="secondary" onClick={()=>exportCSV(

        `compras-crypto-${today()}.csv`)}>📥 Exportar Excel</Btn>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>

// ─── VENTAS CRYPTO ────────────────────────────────────────────────────────
function SalesModule({sales,inventory,clients,reload,toast}){
  const[modal,setModal]=useState(false);
  const[saving,setSaving]=useState(false);
  const[period,setPeriod]=useState("month");
  const[from,setFrom]=useState("");const[to,setTo]=useState("");
  const[filterSym,setFilterSym]=useState("all");
  const empty={date:today(),symbol:"USDT",quantity:"",unit_price:"",client:"",pay_method:"transferencia",notes:""};
  const[form,setForm]=useState(empty);
  const f=k=>v=>setForm(p=>({...p,[k]:v}));

  const filtered=sales.filter(s=>inPeriod(s.date,period,from,to)&&(filterSym==="all"||s.symbol===filterSym));
  const rev=filtered.reduce((a,s)=>a+s.total,0);
  const cogs=filtered.reduce((a,s)=>a+(+s.cogs||0),0);
  const profit=filtered.reduce((a,s)=>a+(+s.gross_profit||0),0);

  const curInv=inventory.find(i=>i.symbol===form.symbol);
  const estProfit=curInv&&form.quantity&&form.unit_price?(+form.quantity*+form.unit_price)-(+form.quantity*+curInv.avg_cost):null;

  const save=async()=>{
    if(!form.quantity||!form.unit_price){toast("Completa cantidad y precio","error");return;}

      toast(`Inventario insuficiente. Disponible: ${fmtQ(curInv?.quantity||0,form.symbol)} ${form.symbol}`,"error");return;
    }
    setSaving(true);
    try{
      const r=await api.addSale(form);
      await reload();
      setModal(false);setForm(empty);
      toast(`Venta registrada · Utilidad: ${fmt(r.gross_profit||0)}`);
    }catch(e){toast(e.message,"error");}
    finally{setSaving(false);}

    {key:"quantity",label:"Cantidad",render:(v,r)=><span style={{fontFamily:"monospace"}}>{fmtQ(v,r.symbol)}</span>},

    {key:"total",label:"Ingreso",render:v=>fmt(v)},

    {key:"pay_method",label:"Método"},

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>

    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Ingresos" value={fmtK(rev)} accent={C.blue}/>
      <Stat label="Costo (CPP)" value={fmtK(cogs)} accent={C.rose}/>
      <Stat label="Utilidad" value={fmtK(profit)} accent={C.green}/>
      <Stat label="Margen" value={`${rev>0?((profit/rev)*100).toFixed(2):0}%`} accent={C.accentL}/>
    </div>
    <div style={{display:"flex",justifyContent:"flex-end"}}>
      <Btn small variant="secondary" onClick={()=>exportCSV(
        ["Fecha","Moneda","Cantidad","Precio Venta","CPP","Ingreso","Costo","Utilidad","Cliente","Método","Notas"],
        filtered.map(s=>[s.date,s.symbol,s.quantity,s.unit_price,s.avg_cost_used,s.total,s.cogs,s.gross_profit,s.client||"",s.pay_method||"",s.notes||""]),
        `ventas-crypto-${today()}.csv`)}>📥 Exportar Excel</Btn>
    </div>
    <Tabla cols={cols} rows={filtered} emptyMsg="No hay ventas en este período"/>

    {modal&&<Modal title="Nueva Venta" onClose={()=>{setModal(false);setForm(empty);}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Fecha" type="date" value={form.date} onChange={f("date")}/>
          <Sel label="Moneda" value={form.symbol} onChange={f("symbol")} options={
            inventory.filter(i=>+i.quantity>0).length>0
              ? inventory.filter(i=>+i.quantity>0).map(i=>({value:i.symbol,label:`${i.symbol} · ${fmtQ(i.quantity,i.symbol)} disp.`}))
              : [{value:"USDT",label:"USDT (sin inventario)"}]

        </div>
        {curInv&&<div style={{background:C.panel,borderRadius:8,padding:10,display:"flex",gap:14,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:C.muted}}>Disponible: <b style={{color:COIN_C[form.symbol]}}>{fmtQ(curInv.quantity,form.symbol)}</b></span>
          <span style={{fontSize:12,color:C.muted}}>CPP: <b style={{color:C.text}}>{fmt(curInv.avg_cost)}</b></span>
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Cantidad a vender" type="number" value={form.quantity} onChange={f("quantity")} placeholder="Ej: 10000"/>
          <Inp label="Precio unitario COP" type="number" value={form.unit_price} onChange={f("unit_price")} placeholder="Ej: 3580"/>
        </div>
        {estProfit!==null&&<div style={{background:estProfit>=0?"#0D2B1D":"#2D1218",border:`1px solid ${estProfit>=0?C.green:C.rose}`,borderRadius:8,padding:12,display:"flex",gap:14,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:C.muted}}>Ingreso: <b style={{color:C.text}}>{fmt(+form.quantity*+form.unit_price)}</b></span>
          <span style={{fontSize:13,color:C.muted}}>Costo: <b style={{color:C.rose}}>{fmt(+form.quantity*+curInv.avg_cost)}</b></span>
          <span style={{fontSize:13,color:C.muted}}>Utilidad: <b style={{color:estProfit>=0?C.green:C.rose,fontSize:15}}>{fmt(estProfit)}</b></span>
        </div>}
        <Inp label="Cliente" value={form.client} onChange={f("client")} list="clients-dl" placeholder="Nombre o alias"/>
        <datalist id="clients-dl">{clients.map(c=><option key={c.id} value={c.name}/>)}</datalist>
        <Sel label="Método de pago" value={form.pay_method} onChange={f("pay_method")} options={["transferencia","efectivo","nequi","daviplata","binance pay","cripto"].map(m=>({value:m,label:m.charAt(0).toUpperCase()+m.slice(1)}))}/>
        <Inp label="Notas" value={form.notes} onChange={f("notes")}/>
        <Btn onClick={save} disabled={saving} full>{saving?"Procesando...":"Registrar Venta"}</Btn>
      </div>
    </Modal>}
  </div>;
}

function clientLedger(client, sales, purchases){
  const n=norm(client.name);
  const ventas=sales.filter(s=>norm(s.client)===n).map(s=>({
    id:"v"+s.id,date:s.date,type:"venta",symbol:s.symbol,qty:+s.quantity,
    price:+s.unit_price,total:+s.total,profit:+s.gross_profit||0,method:s.pay_method,notes:s.notes
  }));
  const compras=purchases.filter(p=>norm(p.supplier)===n).map(p=>({
    id:"c"+p.id,date:p.date,type:"compra",symbol:p.symbol,qty:+p.quantity,
    price:+p.unit_cost,total:+p.total,profit:0,method:p.pay_method,notes:p.notes
  }));
  const ops=[...ventas,...compras].sort((a,b)=>b.date.localeCompare(a.date));
  const volCOP=ops.reduce((a,o)=>a+o.total,0);
  const volBySym={};ops.forEach(o=>volBySym[o.symbol]=(volBySym[o.symbol]||0)+o.qty);
  const profit=ventas.reduce((a,o)=>a+o.profit,0);
  const dates=ops.map(o=>o.date).sort();
  return {ops,ventas,compras,volCOP,volBySym,profit,first:dates[0]||null,last:dates[dates.length-1]||null};
}

    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"flex",gap:6}}>
      {[["all","Todos"],["ingreso","Ingresos"],["egreso","Egresos"]].map(([v,l])=><Pill key={v} label={l} active={filter===v} onClick={()=>setFilter(v)}/>)}
    </div>
    <Tabla cols={cols} rows={filtered} emptyMsg="Sin movimientos en este período"/>
    {modal&&<Modal title="Nuevo Movimiento" onClose={()=>{setModal(false);setForm(empty);}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Fecha" type="date" value={form.date} onChange={f("date")}/>
          <Sel label="Tipo" value={form.type} onChange={f("type")} options={[{value:"ingreso",label:"Ingreso"},{value:"egreso",label:"Egreso"}]}/>
        </div>
        <Inp label="Descripción" value={form.description} onChange={f("description")} placeholder="Ej: Aporte de capital"/>
        <Inp label="Valor" type="number" value={form.amount} onChange={f("amount")}/>
        <Sel label="Método" value={form.method} onChange={f("method")} options={["transferencia","efectivo","nequi","daviplata"].map(m=>({value:m,label:m.charAt(0).toUpperCase()+m.slice(1)}))}/>
        <Btn onClick={save} full>Registrar</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── GASTOS ───────────────────────────────────────────────────────────────
function ExpensesModule({expenses,reload,toast}){
  const[modal,setModal]=useState(false);
  const CATS=["Arriendo","Servicios","Comisiones","Publicidad","Nómina","Otros"];
  const CC={Arriendo:C.blue,Servicios:C.green,Comisiones:C.amber,Publicidad:"#A855F7",Nómina:C.rose,Otros:C.slate};
  const empty={date:today(),category:"Comisiones",description:"",amount:""};
  const[form,setForm]=useState(empty);
  const f=k=>v=>setForm(p=>({...p,[k]:v}));
  const grand=expenses.reduce((a,e)=>a+e.amount,0);

  const save=async()=>{
    if(!form.amount||+form.amount<=0){toast("Ingresa un valor válido","error");return;}
    try{ await api.addExpense(form);await reload();setModal(false);setForm(empty);toast("Gasto registrado"); }
    catch(e){toast(e.message,"error");}
  };

  const cols=[
    {key:"date",label:"Fecha"},
    {key:"category",label:"Categoría",render:v=><span style={{padding:"2px 9px",borderRadius:20,fontSize:11,fontWeight:600,background:`${CC[v]||C.slate}22`,color:CC[v]||C.slate}}>{v}</span>},
    {key:"description",label:"Descripción"},
    {key:"amount",label:"Valor",render:v=><b style={{color:C.rose}}>{fmt(v)}</b>},
    {key:"del",label:"",render:(_,r)=><button onClick={async e=>{e.stopPropagation();try{await api.delExpense(r.id);await reload();toast("Eliminado");}catch(er){toast(er.message,"error");}}} style={{fontSize:11,background:"#2D1218",border:`1px solid ${C.rose}`,color:C.rose,borderRadius:6,padding:"2px 8px",cursor:"pointer"}}>✕</button>},
  ];

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Gastos Operativos" sub={`Total: ${fmt(grand)}`} action="Nuevo Gasto" onAction={()=>setModal(true)}/>
    <Tabla cols={cols} rows={expenses} emptyMsg="Sin gastos registrados"/>
    {modal&&<Modal title="Nuevo Gasto" onClose={()=>{setModal(false);setForm(empty);}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Fecha" type="date" value={form.date} onChange={f("date")}/>
          <Sel label="Categoría" value={form.category} onChange={f("category")} options={CATS.map(c=>({value:c,label:c}))}/>
        </div>
        <Inp label="Descripción" value={form.description} onChange={f("description")}/>
        <Inp label="Valor" type="number" value={form.amount} onChange={f("amount")}/>
        <Btn onClick={save} full>Guardar Gasto</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── RENTABILIDAD ─────────────────────────────────────────────────────────
function ProfitModule({sales,purchases,expenses,inventory}){
  const[period,setPeriod]=useState("month");
  const[from,setFrom]=useState("");const[to,setTo]=useState("");

  const fs=sales.filter(s=>inPeriod(s.date,period,from,to));
  const fe=expenses.filter(e=>inPeriod(e.date,period,from,to));
  const rev=fs.reduce((a,s)=>a+s.total,0);
  const cogs=fs.reduce((a,s)=>a+(+s.cogs||0),0);
  const gross=fs.reduce((a,s)=>a+(+s.gross_profit||0),0);
  const exp=fe.reduce((a,e)=>a+e.amount,0);
  const net=gross-exp;
  const margin=rev>0?((net/rev)*100).toFixed(2):0;

  const bySym=COINS.map(sym=>({
    sym,
    rev:fs.filter(s=>s.symbol===sym).reduce((a,s)=>a+s.total,0),
    profit:fs.filter(s=>s.symbol===sym).reduce((a,s)=>a+(+s.gross_profit||0),0),
    qty:fs.filter(s=>s.symbol===sym).reduce((a,s)=>a+ +s.quantity,0),
    ops:fs.filter(s=>s.symbol===sym).length,
  })).filter(r=>r.ops>0).sort((a,b)=>b.profit-a.profit);

  const maxProfit=Math.max(...bySym.map(r=>r.profit),1);

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <Head title="Rentabilidad" sub="utilidad real basada en costo promedio ponderado"/>
    <PeriodBar period={period} setPeriod={setPeriod} from={from} setFrom={setFrom} to={to} setTo={setTo}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <Stat label="Ingresos" value={fmtK(rev)} accent={C.blue}/>
      <Stat label="Costo Vendido" value={fmtK(cogs)} accent={C.rose}/>
      <Stat label="Utilidad Bruta" value={fmtK(gross)} accent={C.amber}/>
      <Stat label="Gastos" value={fmtK(exp)} accent={C.rose}/>
      <Stat label="Utilidad Neta" value={fmtK(net)} accent={net>=0?C.green:C.rose}/>
      <Stat label="Margen Neto" value={`${margin}%`} accent={+margin>1.5?C.green:+margin>0.5?C.amber:C.rose}/>
    </div>

    {/* P&L */}
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:20}}>
      <h4 style={{margin:"0 0 14px",color:C.text,fontSize:15,fontWeight:700}}>Estado de Resultados</h4>
      {[
        {l:"(+) Ingresos por ventas",v:rev,c:C.text},
        {l:"(−) Costo de criptomonedas vendidas",v:cogs,c:C.rose},
        {l:"= Utilidad bruta",v:gross,c:C.amber,b:1},
        {l:"(−) Gastos operativos",v:exp,c:C.rose},
        {l:"= Utilidad neta",v:net,c:net>=0?C.green:C.rose,b:1,big:1},
      ].map((r,i,arr)=><div key={r.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none"}}>
        <span style={{fontSize:r.big?15:13,fontWeight:r.b?700:400,color:C.text}}>{r.l}</span>
        <span style={{fontSize:r.big?19:14,fontWeight:r.b?700:500,color:r.c,fontFamily:"monospace"}}>{fmt(r.v)}</span>
      </div>)}
    </div>

    {/* Por moneda */}
    {bySym.length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
      <h4 style={{margin:"0 0 14px",color:C.text,fontSize:14,fontWeight:600}}>Rentabilidad por Moneda</h4>
      {bySym.map(r=><div key={r.sym} style={{marginBottom:13}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,flexWrap:"wrap",gap:4}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:COIN_C[r.sym]||C.accent}}/>
            <b style={{fontSize:13}}>{r.sym}</b>
            <span style={{fontSize:11,color:C.muted}}>{r.ops} ops · {fmtQ(r.qty,r.sym)}</span>
          </div>
          <div style={{display:"flex",gap:12}}>
            <span style={{fontSize:11,color:C.muted}}>Ingreso {fmtK(r.rev)}</span>
            <b style={{fontSize:13,color:r.profit>=0?C.green:C.rose}}>{fmt(r.profit)}</b>
          </div>
        </div>
        <div style={{height:5,background:C.border,borderRadius:3}}>
          <div style={{height:"100%",background:COIN_C[r.sym]||C.accent,borderRadius:3,width:`${Math.max(3,(r.profit/maxProfit)*100)}%`}}/>
        </div>
      </div>)}
    </div>}
  </div>;
}

// ─── NAV + APP ────────────────────────────────────────────────────────────
const NAV=[
  {id:"dash",icon:"📊",label:"Dashboard",g:"Principal"},
  {id:"buy",icon:"⬇️",label:"Compras",g:"Operaciones"},
  {id:"sell",icon:"⬆️",label:"Ventas",g:"Operaciones"},
  {id:"inv",icon:"₿",label:"Inventario",g:"Operaciones"},
  {id:"clients",icon:"👥",label:"Clientes",g:"Contactos"},
  {id:"suppliers",icon:"🏦",label:"Proveedores",g:"Contactos"},
  {id:"cash",icon:"💳",label:"Flujo de Caja",g:"Finanzas"},
  {id:"exp",icon:"💸",label:"Gastos",g:"Finanzas"},
  {id:"profit",icon:"💹",label:"Rentabilidad",g:"Finanzas"},
];
const GROUPS=["Principal","Operaciones","Contactos","Finanzas"];

function App(){
  const[user,setUser]=useState(null);
  const[checking,setChecking]=useState(true);
  const[active,setActive]=useState("dash");
  const[sidebar,setSidebar]=useState(false);
  const[loading,setLoading]=useState(false);
  const{toasts,show:toast,remove}=useToast();

  const[clients,setClients]=useState([]);
  const[suppliers,setSuppliers]=useState([]);
  const[inventory,setInventory]=useState([]);
  const[purchases,setPurchases]=useState([]);
  const[sales,setSales]=useState([]);
  const[kardex,setKardex]=useState([]);
  const[cashflow,setCashflow]=useState([]);
  const[expenses,setExpenses]=useState([]);
  const[goal,setGoal]=useState(null);

  const reload=async()=>{
    const[cl,su,inv,pu,sa,ka,cf,ex,go]=await Promise.all([
      api.getClients(),api.getSuppliers(),api.getInventory(),
      api.getPurchases(),api.getSales(),api.getKardex(),
      api.getCashFlow(),api.getExpenses(),api.getGoal()
    ]);
    setClients(cl);setSuppliers(su);setInventory(inv);
    setPurchases(pu);setSales(sa);setKardex(ka);
    setCashflow(cf);setExpenses(ex);setGoal(go);
  };

  // Restaurar sesión al cargar
  useEffect(()=>{
    api.session().then(async u=>{
      if(u){ setUser(u); setLoading(true); try{await reload();}catch(e){toast(e.message,"error");} setLoading(false); }
    }).finally(()=>setChecking(false));
  },[]);

  const handleLogin=async u=>{
    setUser(u);setLoading(true);
    try{await reload();}catch(e){toast("Error cargando datos: "+e.message,"error");}
    setLoading(false);
  };

  const handleLogout=async()=>{
    await api.logout();setUser(null);
    setClients([]);setSuppliers([]);setInventory([]);setPurchases([]);
    setSales([]);setKardex([]);setCashflow([]);setExpenses([]);setGoal(null);
  };

  const saveGoal=async g=>{ const r=await api.saveGoal(g); setGoal(r); };

  const W=typeof window!=="undefined"?window.innerWidth:1024;
  const isMobile=W<768;
  const SW=225;

  if(checking) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:14}}>Cargando...</div>;
  if(!user) return <Login onLogin={handleLogin}/>;

  const navItem=NAV.find(n=>n.id===active)||NAV[0];
  const props={clients,suppliers,inventory,purchases,sales,kardex,cashflow,expenses,goal,reload,toast,onSaveGoal:saveGoal};

  const Module=()=>{
    if(loading) return <div style={{padding:60,textAlign:"center",color:C.muted}}>Cargando datos...</div>;
    switch(active){
      case "dash": return <Dashboard {...props}/>;
      case "buy": return <PurchasesModule {...props}/>;
      case "sell": return <SalesModule {...props}/>;
      case "inv": return <InventoryModule {...props}/>;
      case "clients": return <ClientsModule {...props}/>;
      case "suppliers": return <SuppliersModule {...props}/>;
      case "cash": return <CashFlowModule {...props}/>;
      case "exp": return <ExpensesModule {...props}/>;
      case "profit": return <ProfitModule {...props}/>;
      default: return null;
    }
  };

  return <div style={{minHeight:"100vh",background:C.bg,display:"flex"}}>
    {sidebar&&<div onClick={()=>setSidebar(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:40}}/>}

    <nav style={{width:SW,background:C.panel,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",position:"fixed",top:0,bottom:0,left:0,zIndex:50,transform:isMobile?`translateX(${sidebar?0:-SW}px)`:"none",transition:"transform .25s"}}>
      <div style={{padding:"18px 14px 12px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:26,color:C.accentL}}>₿</span>
          <div>
            <div style={{fontSize:13,fontWeight:800}}>Casa de Cambio</div>
            <div style={{fontSize:10,color:C.muted}}>{user.name||user.email}</div>
          </div>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"6px 8px"}}>
        {GROUPS.map(g=><div key={g} style={{marginBottom:6}}>
          <div style={{fontSize:9,color:C.slate,textTransform:"uppercase",letterSpacing:1,padding:"6px 12px 3px",fontWeight:700}}>{g}</div>
          {NAV.filter(n=>n.g===g).map(n=><button key={n.id}
            onClick={()=>{setActive(n.id);setSidebar(false);}}
            style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"8px 12px",background:active===n.id?`${C.accent}1A`:"transparent",border:`1px solid ${active===n.id?C.accent:"transparent"}`,borderRadius:8,cursor:"pointer",textAlign:"left",marginBottom:1,color:active===n.id?C.accentL:C.muted,fontSize:13,fontWeight:active===n.id?600:400}}>
            <span style={{fontSize:14}}>{n.icon}</span>{n.label}
          </button>)}
        </div>)}
      </div>
      <div style={{padding:"10px 14px",borderTop:`1px solid ${C.border}`}}>
        <div style={{fontSize:11,color:C.muted,marginBottom:7}}>👤 {user.role==="admin"?"Administrador":"Empleado"}</div>
        <button onClick={handleLogout} style={{width:"100%",padding:7,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,cursor:"pointer",fontSize:12}}>Cerrar sesión</button>
      </div>
    </nav>

    <div style={{marginLeft:isMobile?0:SW,flex:1,display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      <header style={{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"0 16px",height:50,display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:30}}>
        {isMobile&&<button onClick={()=>setSidebar(s=>!s)} style={{background:"none",border:"none",color:C.muted,fontSize:20,cursor:"pointer",padding:4}}>☰</button>}
        <span style={{fontSize:15}}>{navItem.icon}</span>
        <h2 style={{margin:0,fontSize:15,fontWeight:700,flex:1}}>{navItem.label}</h2>
        <button onClick={async()=>{setLoading(true);try{await reload();toast("Datos actualizados");}catch(e){toast(e.message,"error");}setLoading(false);}}
          style={{background:"none",border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>🔄</button>
        <div style={{fontSize:11,color:C.muted}}>{new Date().toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"})}</div>
      </header>
      <main style={{flex:1,padding:"16px 14px 40px",maxWidth:1400,width:"100%",margin:"0 auto"}}>
        <Module/>
      </main>
    </div>

    {toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onDone={()=>remove(t.id)}/>)}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
